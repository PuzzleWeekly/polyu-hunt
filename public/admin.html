<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyU Treasure Hunt - Admin Portal</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- FIREBASE COMPAT SETUP -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDUCHks8Q3smU6dMruN-otcpEWCamOOWPA",
            authDomain: "polyu-hunt.firebaseapp.com",
            projectId: "polyu-hunt",
            storageBucket: "polyu-hunt.firebasestorage.app",
            messagingSenderId: "958809195745",
            appId: "1:958809195745:web:1be0bc46e7cdf88a6e63a0",
            measurementId: "G-S3HQ8XDE59"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "polyu_hunt_game_v6"; // Match main game DB

        window.FB = {
            auth, db, appId,
            signInAnonymously: (a) => a.signInAnonymously(),
            onAuthStateChanged: (a, cb) => a.onAuthStateChanged(cb),
            collection: (d, ...paths) => d.collection(paths.join('/')),
            doc: (d, ...paths) => d.doc(paths.join('/')),
            setDoc: (ref, data, opts) => ref.set(data, opts),
            getDoc: (ref) => ref.get(),
            updateDoc: (ref, data) => ref.update(data),
            deleteDoc: (ref) => ref.delete(),
            onSnapshot: (ref, cb, errCb) => ref.onSnapshot(cb, errCb),
            deleteField: () => firebase.firestore.FieldValue.delete()
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .sidebar-active { background-color: #A6192E; color: white; }
        .sidebar-inactive { color: #4b5563; }
        .sidebar-inactive:hover { background-color: #f3f4f6; color: #111827; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useRef } = React;

        // 10 Locations List 
        const LOCATIONS = [
            { id: 'alumni_atrium', qrId: 'x7K9pM2v', name: 'Alumni Atrium (校友薈)', code: '4829' },
            { id: 'core_a', qrId: 'b3N8vC1x', name: 'Main Entrance (主校門)', code: '7153' },
            { id: 'uni_gallery', qrId: 'p8L4jT6n', name: 'University Gallery (大學展覽館)', code: '8371' },
            { id: 'logo_square', qrId: 'r2Y7cX5h', name: 'Logo Square (陳瑞球林滿珍伉儷廣場)', code: '5692' },
            { id: 'va_kiosk', qrId: 'k9F3vB8m', name: 'VA Kiosk', code: '3184' },
            { id: 'core_w', qrId: 'c2M5nB8k', name: 'Lee Shau Kee Building (李兆基樓)', code: '1892' },
            { id: 'library', qrId: 'L9p1xZ4m', name: 'Pao Yue-kong Library (包玉剛圖書館)', code: '4017' },
            { id: 'house_of_innovation', qrId: 'h7J3vC2n', name: 'House of Innovation (創新館)', code: '6351' },
            { id: 'innovation_tower', qrId: 'T5b8kM1x', name: 'Jockey Club Innovation Tower (賽馬會創新樓)', code: '9274' },
            { id: 'brick_wall', qrId: 'w2N9cZ5b', name: 'Commemorative Brick Wall (紀念磚牆)', code: '2835' }
        ];

        const formatTime = (iso) => iso ? new Date(iso).toLocaleString() : '-';
        const formatDuration = (startIso, endIso) => {
            if (!startIso || !endIso) return '-';
            const diffMs = new Date(endIso) - new Date(startIso);
            if (diffMs < 0) return '-';
            const totalSeconds = Math.floor(diffMs / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            return hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m ${totalSeconds % 60}s`;
        };
        const getLocalYYYYMMDD = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const AdminLogin = ({ onLogin, adminConfig }) => {
            const [pass, setPass] = useState('');
            const [error, setError] = useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                const inputHash = pass.trim().split('').map(c => c.charCodeAt(0).toString(16)).join('');
                if (inputHash === adminConfig.passHash) {
                    onLogin();
                } else {
                    setError(true);
                    setPass('');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border-t-8 border-[#A6192E]">
                        <div className="text-center mb-6">
                            <i className="fa fa-lock text-4xl text-[#A6192E] mb-2"></i>
                            <h1 className="text-2xl font-bold">Admin Portal</h1>
                            <p className="text-sm text-gray-500">PolyU Homecoming Week</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input 
                                type="password" 
                                placeholder="Admin Password" 
                                className={`w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-[#A6192E] ${error ? 'border-red-500' : ''}`}
                                value={pass} 
                                onChange={e => { setPass(e.target.value); setError(false); }} 
                            />
                            {error && <p className="text-red-500 text-xs text-center font-bold">Incorrect Password</p>}
                            <button type="submit" className="w-full bg-[#A6192E] text-white py-3 rounded-xl font-bold shadow-lg hover:bg-red-800 transition">
                                Access Dashboard
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const AdminApp = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [adminConfig, setAdminConfig] = useState({ passHash: '7077686f6d65636f6d696e67706f6c79755f32303236', startDate: getLocalYYYYMMDD(), locationOrder: LOCATIONS.map(l=>l.id) });
            const [allUsers, setAllUsers] = useState([]);
            const [content, setContent] = useState({ questions: {} });
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Edit User State
            const [searchEmail, setSearchEmail] = useState('');
            const [editingUser, setEditingUser] = useState(null);
            const [editedBaseLocs, setEditedBaseLocs] = useState([]);
            const [editedBonusLocs, setEditedBonusLocs] = useState([]);

            // Settings State
            const [newPass, setNewPass] = useState('');
            const [newStartDate, setNewStartDate] = useState('');
            const [tempOrder, setTempOrder] = useState([]);

            // Content Editor State
            const [editLoc, setEditLoc] = useState(LOCATIONS[0].id);
            const [editLang, setEditLang] = useState('en');
            const [qText, setQText] = useState('');
            const [qOptions, setQOptions] = useState(['','','','']);
            const [qAnsIndex, setQAnsIndex] = useState(0); 

            useEffect(() => {
                const init = async () => {
                    const { auth, signInAnonymously, db, doc, onSnapshot, appId } = window.FB;
                    await signInAnonymously(auth);
                    
                    // Listen to Config
                    const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'content', 'admin_settings_v2');
                    onSnapshot(configRef, (snap) => {
                        if (snap.exists || (typeof snap.exists === 'function' && snap.exists())) {
                            const data = snap.data();
                            setAdminConfig(data);
                            setNewStartDate(data.startDate || getLocalYYYYMMDD());
                            setTempOrder(data.locationOrder || LOCATIONS.map(l=>l.id));
                        }
                    });

                    // Listen to Users
                    const usersRef = window.FB.collection(db, 'artifacts', appId, 'public', 'data', 'participants');
                    onSnapshot(usersRef, (snap) => {
                        const users = [];
                        snap.forEach(d => users.push({ ...d.data(), id: d.id }));
                        setAllUsers(users);
                    });

                    // Listen to Content
                    const contentRef = doc(db, 'artifacts', appId, 'public', 'data', 'content', 'main');
                    onSnapshot(contentRef, (snap) => {
                        if (snap.exists || (typeof snap.exists === 'function' && snap.exists())) {
                            setContent(snap.data());
                        }
                    });
                };
                init();
            }, []);

            // Handle loading editor content when location/language changes
            useEffect(() => {
                if (content && content.questions && content.questions[editLoc]) {
                    const dbQ = content.questions[editLoc];
                    setQText(dbQ.text?.[editLang] || '');
                    const opts = dbQ.options?.[editLang] || ['','','',''];
                    setQOptions(opts);
                    const ans = dbQ.answer?.[editLang] || '';
                    let ansIdx = opts.indexOf(ans);
                    setQAnsIndex(ansIdx !== -1 ? ansIdx : 0);
                } else {
                    setQText('');
                    setQOptions(['','','','']);
                    setQAnsIndex(0);
                }
            }, [editLoc, editLang, content]);

            const totalPoints = useMemo(() => {
                return allUsers.reduce((acc, user) => acc + (user.clearedLocations?.length || 0) + (user.bonusLocations?.length || 0), 0);
            }, [allUsers]);

            const downloadCSV = (filename, data) => {
                const csv = "data:text/csv;charset=utf-8," + data.map(r => Object.values(r).join(",")).join("\n");
                const link = document.createElement("a");
                link.setAttribute("href", encodeURI(csv));
                link.setAttribute("download", filename);
                document.body.appendChild(link);
                link.click();
                link.remove();
            };

            const handleExport = (type) => {
                const users = allUsers.filter(u => u.version === type);
                const headers = ["Name", "Email", "Role", "Version", "Quiz Points", "QR Points", "Total Points", "Joined At", "Completed At", "Duration"];
                
                const rows = [headers, ...users.map(u => {
                    const basePts = (u.clearedLocations || []).length;
                    const bonusPts = (u.bonusLocations || []).length;
                    const baseArr = [
                        `"${u.name || ''}"`, `"${u.email || ''}"`, `"${u.role || ''}"`, `"${u.version || ''}"`,
                        basePts, bonusPts, basePts + bonusPts,
                        `"${formatTime(u.joinedAt)}"`, `"${formatTime(u.completedAt)}"`, `"${formatDuration(u.joinedAt, u.completedAt)}"`
                    ];
                    return baseArr;
                })];

                downloadCSV(`polyu_hunt_${type}_users.csv`, rows);
            };

            const handleSearchUser = () => {
                const found = allUsers.find(u => u.email.toLowerCase() === searchEmail.trim().toLowerCase());
                if (found) {
                    setEditingUser(found);
                    setEditedBaseLocs(found.clearedLocations || []);
                    setEditedBonusLocs(found.bonusLocations || []);
                } else {
                    alert("User not found.");
                    setEditingUser(null);
                }
            };

            const handleDeleteUser = async (userObj) => {
                const confirmed = window.confirm(`Are you sure you want to permanently delete the account for: ${userObj.email}?`);
                if (confirmed) {
                    const { db, doc, deleteDoc, appId } = window.FB;
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', userObj.id || userObj.uid));
                        if (editingUser && (editingUser.id === userObj.id)) {
                            setEditingUser(null);
                            setSearchEmail('');
                        }
                    } catch (e) {
                        alert("Error deleting user.");
                        console.error(e);
                    }
                }
            };

            const handleSaveUser = async () => {
                if (!editingUser) return;
                const { db, doc, setDoc, appId } = window.FB;
                
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', editingUser.id), {
                        clearedLocations: editedBaseLocs,
                        bonusLocations: editedBonusLocs
                    }, { merge: true });
                    alert("User progress updated successfully!");
                } catch (e) {
                    alert("Error saving user data.");
                }
            };

            const handleUpdateSettings = async () => {
                const { db, doc, setDoc, appId } = window.FB;
                const updates = {};
                if (newPass.trim() !== '') {
                    updates.passHash = newPass.trim().split('').map(c => c.charCodeAt(0).toString(16)).join('');
                }
                if (newStartDate !== '') {
                    updates.startDate = newStartDate;
                }
                if (tempOrder.length > 0) {
                    updates.locationOrder = tempOrder;
                }
                
                if (Object.keys(updates).length > 0) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'content', 'admin_settings_v2'), updates, { merge: true });
                    setNewPass('');
                    alert("Settings updated successfully!");
                }
            };

            const handleSaveContent = async () => {
                const { db, doc, setDoc, appId } = window.FB;
                const newContent = JSON.parse(JSON.stringify(content || { questions: {} }));
                if (!newContent.questions) newContent.questions = {};
                if (!newContent.questions[editLoc]) newContent.questions[editLoc] = { text:{}, options:{}, answer:{} };
                
                newContent.questions[editLoc].text[editLang] = qText;
                newContent.questions[editLoc].options[editLang] = qOptions;
                newContent.questions[editLoc].answer[editLang] = qOptions[qAnsIndex] || qOptions[0]; 
                
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'content', 'main'), newContent, { merge: true });
                alert("Question updated successfully!");
            };

            const moveLocation = (index, direction) => {
                const newOrder = [...tempOrder];
                if (direction === 'up' && index > 0) {
                    [newOrder[index - 1], newOrder[index]] = [newOrder[index], newOrder[index - 1]];
                } else if (direction === 'down' && index < newOrder.length - 1) {
                    [newOrder[index + 1], newOrder[index]] = [newOrder[index], newOrder[index + 1]];
                }
                setTempOrder(newOrder);
            };

            if (!isAuthenticated) return <AdminLogin onLogin={() => setIsAuthenticated(true)} adminConfig={adminConfig} />;

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-64 bg-white shadow-lg flex flex-col z-20 flex-shrink-0">
                        <div className="p-6 border-b text-center">
                            <h2 className="text-xl font-bold text-[#A6192E]">PolyU Treasure Hunt</h2>
                            <p className="text-xs text-gray-500 font-bold uppercase tracking-wider mt-1">Admin Portal</p>
                        </div>
                        <nav className="flex-grow p-4 space-y-2">
                            {[
                                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' },
                                { id: 'users', icon: 'fa-users', label: 'Manage Users' },
                                { id: 'export', icon: 'fa-file-csv', label: 'Export Data' },
                                { id: 'qr', icon: 'fa-qrcode', label: 'QR Codes' },
                                { id: 'editor', icon: 'fa-edit', label: 'Questions Editor' },
                                { id: 'settings', icon: 'fa-cog', label: 'Settings' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg font-bold transition-colors ${activeTab === item.id ? 'sidebar-active shadow' : 'sidebar-inactive'}`}>
                                    <i className={`fa ${item.icon} w-5 text-center`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t">
                            <button onClick={() => window.location.reload()} className="w-full text-left px-4 py-2 text-gray-500 hover:text-red-600 font-bold text-sm">
                                <i className="fa fa-sign-out-alt mr-2"></i> Lock Session
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-grow overflow-y-auto bg-gray-50 p-8">
                        <div className="max-w-6xl mx-auto fade-in">
                            
                            {/* DASHBOARD TAB */}
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Overview</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                                            <div className="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-2xl"><i className="fa fa-users"></i></div>
                                            <div><p className="text-sm font-bold text-gray-400 uppercase">Total Users</p><p className="text-3xl font-black text-gray-800">{allUsers.length}</p></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                                            <div className="w-14 h-14 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center text-2xl"><i className="fa fa-star"></i></div>
                                            <div><p className="text-sm font-bold text-gray-400 uppercase">Total Points Awarded</p><p className="text-3xl font-black text-gray-800">{totalPoints}</p></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                                            <div className="w-14 h-14 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-2xl"><i className="fa fa-globe"></i></div>
                                            <div><p className="text-sm font-bold text-gray-400 uppercase">Overseas Players</p><p className="text-3xl font-black text-gray-800">{allUsers.filter(u=>u.version==='overseas').length}</p></div>
                                        </div>
                                    </div>
                                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                        <div className="px-6 py-4 border-b bg-gray-50"><h3 className="font-bold text-gray-700">Recent Registrations</h3></div>
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-white text-gray-400 border-b"><tr><th className="px-6 py-3">Name</th><th className="px-6 py-3">Email</th><th className="px-6 py-3">Mode</th><th className="px-6 py-3">Joined At</th></tr></thead>
                                            <tbody>
                                                {allUsers.sort((a,b)=>new Date(b.joinedAt)-new Date(a.joinedAt)).slice(0, 5).map(u => (
                                                    <tr key={u.id} className="border-b last:border-0 hover:bg-gray-50"><td className="px-6 py-4 font-bold text-gray-800">{u.name}</td><td className="px-6 py-4 text-gray-600">{u.email}</td><td className="px-6 py-4 capitalize text-xs font-bold text-gray-500">{u.version}</td><td className="px-6 py-4 text-gray-500">{formatTime(u.joinedAt)}</td></tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* USERS TAB */}
                            {activeTab === 'users' && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Manage Users</h2>
                                    
                                    {/* User Search & Editor */}
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                        <div className="flex gap-4 max-w-xl mb-4">
                                            <input type="email" placeholder="Enter full email to edit progress..." className="flex-grow p-3 border rounded-xl outline-none focus:ring-2 focus:ring-[#A6192E]" value={searchEmail} onChange={e=>setSearchEmail(e.target.value)} />
                                            <button onClick={handleSearchUser} className="bg-gray-800 text-white px-6 font-bold rounded-xl hover:bg-black transition"><i className="fa fa-search mr-2"></i> Edit</button>
                                        </div>
                                        
                                        {editingUser && (
                                            <div className="border-t pt-4 slide-up">
                                                <div className="flex justify-between items-start mb-4">
                                                    <div>
                                                        <h3 className="text-xl font-bold text-[#A6192E]">{editingUser.name}</h3>
                                                        <p className="text-gray-500">{editingUser.email} • {editingUser.role}</p>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
                                                    {LOCATIONS.map(loc => {
                                                        const isBaseCleared = editedBaseLocs.includes(loc.id);
                                                        const isBonusCleared = editedBonusLocs.includes(loc.id);
                                                        return (
                                                            <div key={loc.id} className="p-3 border rounded-xl bg-gray-50">
                                                                <div className="font-bold text-gray-700 text-sm mb-2">{loc.name}</div>
                                                                <div className="flex flex-col gap-2">
                                                                    <label className="flex items-center gap-2 cursor-pointer bg-white px-3 py-1 border rounded shadow-sm">
                                                                        <input type="checkbox" className="w-4 h-4 accent-[#A6192E]" checked={isBaseCleared} onChange={e => {
                                                                            const checked = e.target.checked;
                                                                            setEditedBaseLocs(prev => checked ? [...prev, loc.id] : prev.filter(id => id !== loc.id));
                                                                        }} />
                                                                        <span className="text-xs font-bold text-gray-700">Quiz Done (1 Pt)</span>
                                                                    </label>
                                                                    <label className="flex items-center gap-2 cursor-pointer bg-white px-3 py-1 border rounded shadow-sm">
                                                                        <input type="checkbox" className="w-4 h-4 accent-blue-600" checked={isBonusCleared} onChange={e => {
                                                                            const checked = e.target.checked;
                                                                            setEditedBonusLocs(prev => checked ? [...prev, loc.id] : prev.filter(id => id !== loc.id));
                                                                        }} />
                                                                        <span className="text-xs font-bold text-gray-700">QR Scanned (1 Pt)</span>
                                                                    </label>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                <button onClick={handleSaveUser} className="bg-[#A6192E] text-white px-8 py-2 rounded-lg font-bold shadow hover:bg-red-800 transition">Save Progress</button>
                                            </div>
                                        )}
                                    </div>

                                    {/* All Users Table with Remove Action */}
                                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                        <div className="px-6 py-4 border-b bg-gray-50 flex justify-between items-center">
                                            <h3 className="font-bold text-gray-700">All Registered Users</h3>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-sm whitespace-nowrap">
                                                <thead className="bg-white text-gray-400 border-b">
                                                    <tr>
                                                        <th className="px-6 py-3">Name</th>
                                                        <th className="px-6 py-3">Email</th>
                                                        <th className="px-6 py-3">Mode</th>
                                                        <th className="px-6 py-3">Total Pts</th>
                                                        <th className="px-6 py-3">Joined At</th>
                                                        <th className="px-6 py-3 text-right">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {allUsers.map(u => {
                                                        const pts = (u.clearedLocations?.length || 0) + (u.bonusLocations?.length || 0);
                                                        return (
                                                            <tr key={u.id} className="border-b last:border-0 hover:bg-gray-50">
                                                                <td className="px-6 py-4 font-bold text-gray-800">{u.name}</td>
                                                                <td className="px-6 py-4 text-gray-600">{u.email}</td>
                                                                <td className="px-6 py-4 capitalize text-xs font-bold text-gray-500">{u.version}</td>
                                                                <td className="px-6 py-4 font-bold text-[#A6192E]">{pts}</td>
                                                                <td className="px-6 py-4 text-xs text-gray-500">{formatTime(u.joinedAt)}</td>
                                                                <td className="px-6 py-4 text-right">
                                                                    <button onClick={() => {
                                                                        setSearchEmail(u.email);
                                                                        setEditingUser(u);
                                                                        setEditedBaseLocs(u.clearedLocations || []);
                                                                        setEditedBonusLocs(u.bonusLocations || []);
                                                                        window.scrollTo({ top: 0, behavior: 'smooth' });
                                                                    }} className="text-blue-500 hover:text-blue-700 mr-4 font-bold" title="Edit Progress"><i className="fa fa-edit"></i> Edit</button>
                                                                    
                                                                    <button onClick={() => handleDeleteUser(u)} className="text-red-500 hover:text-red-700 font-bold" title="Delete Account"><i className="fa fa-trash"></i> Delete</button>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                    {allUsers.length === 0 && <tr><td colSpan="6" className="text-center py-8 text-gray-400">No users found.</td></tr>}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* EXPORT TAB */}
                            {activeTab === 'export' && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Data Exports</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 text-center">
                                            <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i className="fa fa-university"></i></div>
                                            <h3 className="text-xl font-bold mb-2">On-Campus Users</h3>
                                            <p className="text-gray-500 text-sm mb-6">Export stats for users physically playing on campus.</p>
                                            <button onClick={() => handleExport('local')} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-green-700 transition">Download CSV</button>
                                        </div>
                                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 text-center">
                                            <div className="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i className="fa fa-globe"></i></div>
                                            <h3 className="text-xl font-bold mb-2">Overseas Users</h3>
                                            <p className="text-gray-500 text-sm mb-6">Export remote players, including gift shipping addresses.</p>
                                            <button onClick={() => handleExport('overseas')} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition">Download CSV</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* QR CODES TAB */}
                            {activeTab === 'qr' && (
                                <div className="space-y-6">
                                    <div className="flex justify-between items-end">
                                        <h2 className="text-2xl font-bold text-gray-800">Location QR Codes</h2>
                                        <button onClick={() => window.print()} className="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold hover:bg-black"><i className="fa fa-print mr-2"></i> Print Codes</button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {LOCATIONS.map(l => (
                                            <div key={l.id} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center flex flex-col items-center">
                                                <h3 className="font-bold text-gray-800 mb-4 h-10">{l.name}</h3>
                                                <canvas ref={el => { if(el) new QRious({ element: el, value: `https://polyu-hunt.web.app/?scan=${l.qrId}`, size: 180 }) }} className="mb-4 shadow-sm border p-2 rounded-xl"></canvas>
                                                <div className="bg-gray-100 w-full p-2 rounded text-xs font-mono text-gray-500 break-all select-all">https://polyu-hunt.web.app/?scan={l.qrId}</div>
                                                <div className="mt-4 p-2 bg-yellow-50 text-yellow-800 font-bold border border-yellow-200 rounded w-full">PIN: {l.code}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* EDITOR TAB */}
                            {activeTab === 'editor' && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Quiz Questions Editor</h2>
                                    <div className="bg-white p-6 rounded-xl shadow border border-gray-100 space-y-6">
                                        <div className="flex gap-4 border-b pb-4">
                                            <select className="p-3 border rounded-lg font-bold outline-none focus:ring-2 focus:ring-[#A6192E] flex-grow" value={editLoc} onChange={e=>setEditLoc(e.target.value)}>
                                                {LOCATIONS.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
                                            </select>
                                            <select className="p-3 border rounded-lg font-bold outline-none focus:ring-2 focus:ring-[#A6192E]" value={editLang} onChange={e=>setEditLang(e.target.value)}>
                                                <option value="en">English</option><option value="tc">Traditional Chinese</option><option value="sc">Simplified Chinese</option>
                                            </select>
                                        </div>
                                        
                                        <div className="space-y-4">
                                            <div>
                                                <label className="font-bold text-gray-700 block mb-2">Question Text</label>
                                                <textarea className="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-[#A6192E]" rows="2" value={qText} onChange={e=>setQText(e.target.value)} placeholder="Enter the MC question..."></textarea>
                                            </div>
                                            
                                            <div>
                                                <label className="font-bold text-gray-700 block mb-2">Options & Correct Answer</label>
                                                <p className="text-xs text-gray-500 mb-3">Select the radio button next to the option that is the correct answer.</p>
                                                <div className="space-y-3">
                                                    {qOptions.map((o,i)=> (
                                                        <div key={i} className="flex gap-3 items-center bg-gray-50 p-3 rounded-lg border">
                                                            <input type="radio" name="correctAnswer" className="w-5 h-5 accent-[#A6192E] cursor-pointer" checked={qAnsIndex === i} onChange={() => setQAnsIndex(i)} />
                                                            <input className="w-full p-2 border rounded outline-none focus:border-[#A6192E]" value={o} onChange={e => { const ops = [...qOptions]; ops[i] = e.target.value; setQOptions(ops); }} placeholder={`Option ${i+1}`} />
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <button onClick={handleSaveContent} className="w-full bg-[#A6192E] text-white p-4 rounded-xl font-bold shadow-lg hover:bg-red-800 transition mt-4"><i className="fa fa-save mr-2"></i> Save Question</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* SETTINGS TAB */}
                            {activeTab === 'settings' && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-gray-800">System Settings</h2>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 max-w-2xl">
                                        
                                        <div className="mb-8">
                                            <h3 className="font-bold text-lg text-gray-800 mb-2"><i className="fa fa-calendar-alt text-[#A6192E] mr-2"></i> Game Start Date</h3>
                                            <p className="text-sm text-gray-500 mb-4">Controls the progressive unlocking of missions on the map (1 new mission per day, up to 10).</p>
                                            <div className="flex gap-4">
                                                <input type="date" className="p-3 border rounded-xl flex-grow focus:ring-2 focus:ring-[#A6192E] outline-none font-bold text-gray-700" value={newStartDate} onChange={e => setNewStartDate(e.target.value)} />
                                            </div>
                                        </div>

                                        <div className="pt-8 border-t mb-8">
                                            <h3 className="font-bold text-lg text-gray-800 mb-2"><i className="fa fa-list-ol text-[#A6192E] mr-2"></i> Mission Reveal Order</h3>
                                            <p className="text-sm text-gray-500 mb-4">Set the order in which the 10 locations unlock each day. Day 1 unlocks the top location, Day 2 unlocks the second, etc.</p>
                                            <div className="bg-gray-50 border rounded-xl p-4 space-y-2 max-h-[400px] overflow-y-auto">
                                                {tempOrder.map((locId, index) => {
                                                    const locInfo = LOCATIONS.find(l => l.id === locId);
                                                    if (!locInfo) return null;
                                                    return (
                                                        <div key={locId} className="flex items-center justify-between bg-white p-3 border rounded shadow-sm">
                                                            <div className="flex items-center gap-3">
                                                                <span className="font-bold text-gray-400 w-6">#{index + 1}</span>
                                                                <span className="font-bold text-gray-700 text-sm">{locInfo.name}</span>
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <button onClick={() => moveLocation(index, 'up')} disabled={index === 0} className={`p-2 rounded ${index === 0 ? 'text-gray-300' : 'text-gray-600 hover:bg-gray-100 hover:text-blue-600'}`}><i className="fa fa-arrow-up"></i></button>
                                                                <button onClick={() => moveLocation(index, 'down')} disabled={index === tempOrder.length - 1} className={`p-2 rounded ${index === tempOrder.length - 1 ? 'text-gray-300' : 'text-gray-600 hover:bg-gray-100 hover:text-blue-600'}`}><i className="fa fa-arrow-down"></i></button>
                                                            </div>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>

                                        <div className="pt-8 border-t">
                                            <h3 className="font-bold text-lg text-gray-800 mb-2"><i className="fa fa-key text-[#A6192E] mr-2"></i> Admin Portal Password</h3>
                                            <p className="text-sm text-gray-500 mb-4">Leave blank if you do not want to change it.</p>
                                            <div className="flex gap-4">
                                                <input type="text" placeholder="Enter new password" className="p-3 border rounded-xl flex-grow focus:ring-2 focus:ring-[#A6192E] outline-none" value={newPass} onChange={e => setNewPass(e.target.value)} />
                                            </div>
                                        </div>

                                        <div className="mt-8">
                                            <button onClick={handleUpdateSettings} className="w-full bg-[#A6192E] text-white py-3 rounded-xl font-bold shadow-lg hover:bg-red-800 transition">Save All Settings</button>
                                        </div>

                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
