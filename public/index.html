        const QuizModule = ({ locationId, content, lang, onClear, onFail }) => {
            const t = TRANSLATIONS[lang];
            const q = content?.questions?.[locationId] || DEFAULT_QUESTIONS[locationId];
            const [selected, setSelected] = useState(null);
            const [submitted, setSubmitted] = useState(false);
            const [btnPos, setBtnPos] = useState({ x: 0, y: 0 });
            
            const handleHover = () => setBtnPos({ x: (Math.random() - 0.5) * 150, y: (Math.random() - 0.5) * 150 });

            const handleSubmit = () => {
                if(!selected) return;
                setSubmitted(true);
                if(selected === q.answer[lang]) setTimeout(() => onClear(), 1500);
            };

            const isWrong = submitted && selected !== q.answer[lang];

            return (
                <div className="flex flex-col h-full fade-in pb-4">
                    <div className="flex-grow overflow-y-auto px-6 py-4">
                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-6 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-16 h-16 bg-blue-50 rounded-bl-full -z-10"></div>
                            <span className="text-xs font-black uppercase tracking-wider text-blue-500 mb-2 block">{t.challenge}</span>
                            <h3 className="text-lg font-bold text-gray-800 leading-snug">{q.text[lang]}</h3>
                        </div>
                        <div className="space-y-3">
                            {q.options[lang].map((opt, i) => {
                                const isSelected = selected === opt;
                                const isCorrect = opt === q.answer[lang];
                                let btnClass = "w-full text-left p-4 rounded-xl font-bold transition-all border-2 text-sm ";
                                
                                if (submitted) {
                                    if (isCorrect) btnClass += "border-green-500 bg-green-50 text-green-700 shadow-sm";
                                    else if (isSelected) btnClass += "border-red-500 bg-red-50 text-red-700 opacity-50";
                                    else btnClass += "border-gray-100 bg-gray-50 text-gray-400 opacity-50";
                                } else {
                                    btnClass += isSelected ? "border-blue-500 bg-blue-50 text-blue-700 shadow-md" : "border-gray-200 bg-white text-gray-600 hover:border-blue-300";
                                }

                                return (
                                    <button key={i} disabled={submitted} onClick={() => setSelected(opt)} className={btnClass}>
                                        <div className="flex justify-between items-center">
                                            <span>{opt}</span>
                                            {submitted && isCorrect && <i className="fa fa-check text-green-500 text-lg"></i>}
                                            {submitted && isSelected && !isCorrect && <i className="fa fa-times text-red-500 text-lg"></i>}
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                    
                    <div className="px-6 pt-4 border-t border-gray-100 bg-white relative h-24 flex items-center justify-center">

                                {t.incorrect}

        const PhotoBooth = ({ locationId, lang, onBack }) => {
            const t = TRANSLATIONS[lang];
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [photoData, setPhotoData] = useState(null);
            const [stream, setStream] = useState(null);

            useEffect(() => {
                const initCamera = async () => {
                    try {
                        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                        if (videoRef.current) { videoRef.current.srcObject = s; setStream(s); }
                    } catch (e) { alert("Camera access denied or unavailable."); }
                };
                initCamera();
                return () => { if(stream) stream.getTracks().forEach(t => t.stop()); };
            }, []);

            const capture = () => {
                if (!videoRef.current || !canvasRef.current) return;
                const v = videoRef.current; const c = canvasRef.current; const ctx = c.getContext('2d');
                c.width = v.videoWidth; c.height = v.videoHeight;
                ctx.drawImage(v, 0, 0, c.width, c.height);
                
                const frame = new Image();
                frame.crossOrigin = "anonymous";
                frame.src = `frame_${locationId}.png`;
                frame.onload = () => {
                    ctx.drawImage(frame, 0, 0, c.width, c.height);
                    setPhotoData(c.toDataURL('image/png'));
                };
                frame.onerror = () => { setPhotoData(c.toDataURL('image/png')); };
            };

            const download = () => {
                const link = document.createElement('a'); link.download = `polyu_hunt_${locationId}.png`;
                link.href = photoData; link.click();
            };

            return (
                <div className="flex flex-col h-full bg-black fade-in text-white relative">

                                        <div className="w-16 h-16 border-2 border-dashed border-gray-300 rounded-full"></div>
                                    </button>
                                </div>
                            </>

                                <img src={photoData} className="w-full h-auto max-h-[75vh] object-contain shadow-2xl mb-6" alt="Captured" />
                                <div className="flex gap-4 px-6 w-full max-w-sm">
                                    <button onClick={() => setPhotoData(null)} className="flex-1 py-3 rounded-xl bg-gray-800 text-white font-bold"><i className="fa fa-redo mr-2"></i> {t.retake}</button>
                                    <button onClick={download} className="flex-1 py-3 rounded-xl bg-blue-500 text-white font-bold shadow-lg shadow-blue-500/30"><i className="fa fa-download mr-2"></i> {t.saveShare}</button>
                                </div>

        const Scanner = ({ location, lang, onScanSuccess }) => {
            const t = TRANSLATIONS[lang];
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [stream, setStream] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const scanLoop = useRef(null);

            useEffect(() => {
                const initScanner = async () => {
                    try {
                        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                        if(videoRef.current) { videoRef.current.srcObject = s; setStream(s); }
                        
                        const tick = () => {
                            if(videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
                                const v = videoRef.current; const c = canvasRef.current; const ctx = c.getContext('2d');
                                c.width = v.videoWidth; c.height = v.videoHeight;
                                ctx.drawImage(v, 0, 0, c.width, c.height);
                                const imgData = ctx.getImageData(0, 0, c.width, c.height);
                                const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });
                                if (code && code.data.includes(location.qrId)) { onScanSuccess(); return; }
                            }
                            scanLoop.current = requestAnimationFrame(tick);
                        };
                        scanLoop.current = requestAnimationFrame(tick);
                    } catch(e) { console.warn("Camera init failed", e); }
                };
                initScanner();
                return () => { if(stream) stream.getTracks().forEach(t=>t.stop()); cancelAnimationFrame(scanLoop.current); };
            }, [location]);

                                <div className="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-yellow-400 rounded-tr-xl"></div>

                            </div>

                    <div className="bg-white p-6 rounded-t-3xl relative z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.2)]">

                            <button type="submit" className="px-6 bg-gray-800 text-white rounded-xl font-bold shadow hover:bg-black transition"><i className="fa fa-unlock"></i></button>
                        </form>

                    <style>{`@keyframes scan { 0%, 100% { top: 10%; } 50% { top: 90%; } }`}</style>
                </div>
            );

        const MissionOrchestrator = ({ location, user, content, adminConfig, lang, onSavePoints, onClose, showNotify }) => {

            const startD = parseLocalDate(adminConfig.startDate || '2026-07-28');
            const unlockD = new Date(startD);
            unlockD.setDate(unlockD.getDate() + (orderIndex >= 0 ? orderIndex : 0));
            
            const today = new Date();
            today.setHours(0,0,0,0);
            const isQuizUnlocked = today >= unlockD;
            
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const unlockStr = `${unlockD.getDate()} ${months[unlockD.getMonth()]}`;

            // Check completion status
            const hasQrPt = (user.bonusLocations || []).includes(location.id);
            const hasQuizPt = (user.clearedLocations || []).includes(location.id);
            const totalPts = (hasQrPt ? 1 : 0) + (hasQuizPt ? 1 : 0);

                        {/* Header */}

                                    <i className={`fa ${location.icon} text-[#A6192E]`}></i> {location.name[lang]}
                                </h2>
                                <p className="text-xs font-bold text-gray-500 mt-0.5">{totalPts}/2 {t.stamps}</p>
                            </div>
                            <button onClick={() => view ? setView(null) : onClose()} className="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-300 transition shrink-0">
                                <i className={`fa ${view ? 'fa-arrow-down' : 'fa-times'}`}></i>
                            </button>
                        </div>

                        {/* Content Area */}
                        <div className="flex-grow overflow-hidden relative">
                            {!view ? (
                                <div className="p-6 space-y-4 slide-up overflow-y-auto max-h-full">
                                    
                                    {/* Action 1: QR/PIN (1 Pt) */}
                                    <button onClick={() => setView('qr')} disabled={hasQrPt} className={`w-full flex items-center gap-4 p-5 rounded-2xl border-2 transition text-left
                                        ${hasQrPt ? 'border-green-500 bg-green-50' : 'border-gray-200 bg-white hover:border-yellow-400 hover:shadow-md'}`}>
                                        <div className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl shrink-0
                                            ${hasQrPt ? 'bg-green-500 text-white' : 'bg-yellow-100 text-yellow-600'}`}>
                                            <i className={`fa ${hasQrPt ? 'fa-check' : 'fa-qrcode'}`}></i>
                                        </div>
                                        <div className="flex-grow">
                                            <h3 className={`font-bold text-lg ${hasQrPt ? 'text-green-700' : 'text-gray-800'}`}>{t.scanQr}</h3>
                                            <p className="text-sm font-bold text-gray-400 mt-1">{hasQrPt ? 'Completed' : `+ ${t.qrPoints}`}</p>
                                        </div>
                                    </button>

                                    {/* Action 2: Quiz (1 Pt) */}
                                    <button onClick={() => setView('quiz')} disabled={hasQuizPt || !isQuizUnlocked} className={`w-full flex items-center gap-4 p-5 rounded-2xl border-2 transition text-left relative overflow-hidden
                                        ${hasQuizPt ? 'border-green-500 bg-green-50' : (!isQuizUnlocked ? 'border-gray-100 bg-gray-50 opacity-80' : 'border-gray-200 bg-white hover:border-blue-400 hover:shadow-md')}`}>
                                        <div className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl shrink-0 z-10
                                            ${hasQuizPt ? 'bg-green-500 text-white' : (!isQuizUnlocked ? 'bg-gray-200 text-gray-400' : 'bg-blue-100 text-blue-600')}`}>
                                            <i className={`fa ${hasQuizPt ? 'fa-check' : (!isQuizUnlocked ? 'fa-lock' : 'fa-question')}`}></i>
                                        </div>
                                        <div className="flex-grow z-10">
                                            <h3 className={`font-bold text-lg ${hasQuizPt ? 'text-green-700' : (!isQuizUnlocked ? 'text-gray-400' : 'text-gray-800')}`}>{t.answerQ}</h3>
                                            <p className={`text-sm font-bold mt-1 ${!isQuizUnlocked && !hasQuizPt ? 'text-red-500' : 'text-gray-400'}`}>
                                                {hasQuizPt ? 'Completed' : (!isQuizUnlocked ? `${t.unlocksOn} ${unlockStr}` : `+ ${t.quizPoints}`)}
                                            </p>
                                        </div>
                                        {/* Striped locked background */}
                                        {!isQuizUnlocked && !hasQuizPt && <div className="absolute inset-0 opacity-10" style={{ backgroundImage: 'repeating-linear-gradient(45deg, transparent, transparent 10px, #000 10px, #000 20px)' }}></div>}
                                    </button>

                                    {/* Action 3: Photo Booth */}
                                    <div className="pt-4 border-t border-gray-100 mt-2">
                                        <button onClick={() => setView('photo')} disabled={totalPts === 0} className={`w-full flex flex-col items-center justify-center p-6 rounded-2xl border-2 transition
                                            ${totalPts > 0 ? 'border-purple-200 bg-gradient-to-br from-purple-50 to-pink-50 hover:shadow-lg' : 'border-gray-100 bg-gray-50 opacity-60'}`}>
                                            <i className={`fa fa-camera text-4xl mb-3 ${totalPts > 0 ? 'text-purple-500' : 'text-gray-300'}`}></i>
                                            <span className={`font-black text-lg ${totalPts > 0 ? 'text-purple-800' : 'text-gray-400'}`}>{t.takePhoto}</span>
                                            {totalPts === 0 && <span className="text-xs font-bold text-gray-400 mt-2 text-center max-w-[200px]">{t.lockedPhoto}</span>}
                                        </button>
                                    </div>
                                </div>
                            ) : view === 'qr' ? (
                                <Scanner location={location} lang={lang} onScanSuccess={()=>handlePointGained('qr')} />
                            ) : view === 'quiz' ? (
                                <QuizModule locationId={location.id} content={content} lang={lang} onClear={()=>handlePointGained('quiz')} onFail={()=>setView(null)} />
                            ) : (
                                <PhotoBooth locationId={location.id} lang={lang} onBack={()=>setView(null)} />
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const StampBook = ({ locations, clearedLocations, bonusLocations, onClose, lang }) => {
            const t = TRANSLATIONS[lang];
            const total = clearedLocations.length + bonusLocations.length;
            
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 fade-in backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-white rounded-3xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden shadow-2xl relative slide-up" onClick={e=>e.stopPropagation()}>
                        <div className="p-6 bg-gradient-to-br from-gray-800 to-gray-900 text-white flex justify-between items-center shrink-0">
                            <div>
                                <h2 className="text-2xl font-black tracking-wide">{t.stamps}</h2>
                                <p className="text-gray-300 font-bold text-sm mt-1">{total} / 20 Earned</p>
                            </div>
                            <button onClick={onClose} className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/40"><i className="fa fa-times"></i></button>
                        </div>
                        <div className="flex-grow overflow-y-auto p-4 bg-gray-50">
                            <div className="grid grid-cols-2 gap-3">
                                {locations.map(loc => {
                                    const pts = (clearedLocations.includes(loc.id)?1:0) + (bonusLocations.includes(loc.id)?1:0);
                                    return (
                                        <div key={loc.id} className={`flex flex-col items-center p-4 rounded-2xl border-2 transition-colors ${pts===2?'border-green-500 bg-green-50 shadow-sm':(pts===1?'border-yellow-400 bg-yellow-50':'border-gray-200 bg-white')}`}>
                                            <div className={`stamp-circle mb-3 ${pts>0?'stamp-pop':''} stamp-earned-${pts}`}><i className={`fa ${loc.icon}`}></i></div>
                                            <span className="text-[11px] font-bold text-center leading-tight h-8 flex items-center text-gray-700">{loc.name[lang]}</span>
                                            <div className="mt-2 flex gap-1">
                                                <div className={`w-3 h-3 rounded-full ${bonusLocations.includes(loc.id)?'bg-green-500':'bg-gray-200'}`}></div>
                                                <div className={`w-3 h-3 rounded-full ${clearedLocations.includes(loc.id)?'bg-green-500':'bg-gray-200'}`}></div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const MapScreen = ({ user, locations, clearedLocations, bonusLocations, adminConfig, onSelectLocation, onOpenStampBook, onOpenGift, lang, setLang, onLogout }) => {
            const t = TRANSLATIONS[lang];
            const totalPts = clearedLocations.length + bonusLocations.length; 

            return (
                <div className="flex flex-col h-screen bg-gray-50 relative">
                    {/* Header */}
                    <header className="bg-white/90 backdrop-blur shadow-sm px-4 py-3 z-10 grid grid-cols-[1fr_auto] gap-4 items-stretch absolute top-0 w-full rounded-b-3xl border-b border-gray-100">
                        <div className="flex flex-col gap-2 justify-center">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 bg-[#A6192E] rounded-full flex items-center justify-center text-white font-black text-xl shadow flex-shrink-0">{user.name.charAt(0).toUpperCase()}</div>
                                <div className="overflow-hidden">
                                    <h1 className="font-bold text-gray-800 truncate leading-none mb-1.5 text-lg">{user.name}</h1>
                                    <span className="text-[10px] px-2 py-0.5 rounded font-bold bg-red-100 text-red-700 uppercase tracking-wider">{t[user.version]}</span>
                                </div>
                            </div>
                            <LanguageSwitcher lang={lang} setLang={setLang} />
                        </div>
                        <div className="flex items-center gap-2">
                            {user.version === 'local' && (
                                <button onClick={onOpenGift} className="bg-purple-100 text-purple-800 px-3 py-1 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 shadow-sm h-full w-16 hover:bg-purple-200 transition">
                                    <i className="fa fa-gift text-xl"></i><span>{t.giftBtn}</span>
                                </button>
                            )}
                            <button onClick={onOpenStampBook} className="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 border border-yellow-200 shadow-sm h-full w-20 hover:bg-yellow-200 transition">
                                <i className="fa fa-book-open text-xl text-yellow-600"></i><span>{totalPts} {t.stamps}</span>
                            </button>
                            <button onClick={onLogout} className="w-12 h-full rounded-xl bg-gray-100 text-gray-500 flex items-center justify-center shadow-sm hover:bg-gray-200 transition"><i className="fa fa-sign-out-alt text-lg"></i></button>
                        </div>
                    </header>

                    {/* Map Area */}
                    <main className="flex-grow relative w-full h-full pt-28 pb-4 px-2">
                        <div className="map-container h-full max-h-[800px]">
                            {locations.map(loc => {
                                const hasQr = bonusLocations.includes(loc.id);
                                const hasQuiz = clearedLocations.includes(loc.id);
                                const pts = (hasQr?1:0) + (hasQuiz?1:0);
                                const isUnlocked = true; // All pins visible and clickable immediately
                                
                                return (
                                    <div key={loc.id} className="loc-pin" style={loc.pos} onClick={() => onSelectLocation(loc)}>
                                        <div className={`pin-icon ${pts===2?'pin-2':(pts===1?'pin-1':'pin-0')}`}>
                                            <i className={`fa ${pts===2 ? 'fa-check-double' : (pts===1 ? 'fa-check' : 'fa-map-marker-alt')}`}></i>
                                        </div>
                                        <div className="pin-label">{loc.name[lang]}</div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [lang, setLang] = useState('en'); 
            const [activeLoc, setActiveLoc] = useState(null);
            const [notification, setNotification] = useState(null); 
            const [stampBookOpen, setStampBookOpen] = useState(false);
            const [giftOpen, setGiftOpen] = useState(false);
            const [tutorialOpen, setTutorialOpen] = useState(false);
            
            const [cleared, setCleared] = useState([]); // Quiz points
            const [bonusLocs, setBonusLocs] = useState([]); // QR points
            const [content, setContent] = useState({});
            const [adminConfig, setAdminConfig] = useState({});
            const [initialized, setInitialized] = useState(false);

            useEffect(() => {
                const initApp = async () => {
                    const savedEmail = localStorage.getItem('polyu_hunt_email');
                    const { auth, db, doc, onSnapshot, appId } = window.FB;
                    
                    // Listen to global config and content
                    onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'content', 'main'), snap => setContent(snap.data() || {}));
                    onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'content', 'admin_settings_v2'), snap => setAdminConfig(snap.data() || {}));

                    // Restore session
                    window.FB.onAuthStateChanged(auth, async (fbUser) => {
                        if (fbUser && savedEmail) {
                            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'participants', fbUser.uid), snap => {
                                if (snap.exists) {
                                    const data = snap.data();
                                    setUser({ ...data, uid: fbUser.uid });
                                    setCleared(data.clearedLocations || []);
                                    setBonusLocs(data.bonusLocations || []);
                                    setInitialized(true);
                                } else {
                                    handleLogout(); setInitialized(true);
                                }
                            });
                        } else {
                            setInitialized(true);
                        }
                    });
                };
                initApp();
            }, []);

            const handleRegister = async (userData) => {
                const { db, doc, setDoc, appId } = window.FB;
                const fullData = { ...userData, joinedAt: new Date().toISOString(), clearedLocations: [], bonusLocations: [] };
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', userData.uid), fullData);
                localStorage.setItem('polyu_hunt_email', userData.email);
                setUser(fullData);
                setTutorialOpen(true);
            };

            const handleLogout = async () => {
                if (window.FB.auth) try { await window.FB.auth.signOut(); } catch (e) {}
                setUser(null); setCleared([]); setBonusLocs([]);
                try { localStorage.removeItem('polyu_hunt_email'); } catch (e) {}
            };

            const handleSavePoints = async (locId, type) => {
                const { db, doc, setDoc, appId, auth } = window.FB;
                if (!auth?.currentUser) return;
                
                let newCleared = [...cleared];
                let newBonus = [...bonusLocs];
                if (type === 'quiz' && !cleared.includes(locId)) newCleared.push(locId);
                if (type === 'qr' && !bonusLocs.includes(locId)) newBonus.push(locId);
                
                setCleared(newCleared);
                setBonusLocs(newBonus);
                
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid), {
                        clearedLocations: newCleared, bonusLocations: newBonus
                    }, { merge: true });
                } catch(e) { console.error("Error saving point", e); }
            };

            const handleSaveAddress = async (address) => {
                const { db, doc, updateDoc, appId, auth } = window.FB;
                if (!auth?.currentUser) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid), { address });
                    setUser(prev => ({...prev, address}));
                    showNotify(TRANSLATIONS[lang].giftTitle, TRANSLATIONS[lang].savedMsg, "success", "fa-gift");
                    setGiftOpen(false);
                } catch(e) { console.error("Error saving address:", e); }
            };

            const showNotify = (title, message, type = 'info', customIcon = null) => setNotification({ title, message, type, customIcon });

            if (!initialized) return <div className="min-h-screen flex items-center justify-center bg-gray-50"><i className="fa fa-spinner fa-spin text-4xl text-[#A6192E]"></i></div>;
            
            if (!user) return <Register onComplete={handleRegister} lang={lang} setLang={setLang} />;

            return (
                <div className={`text-gray-800 lang-${lang} h-screen w-full overflow-hidden`}>
                    {notification && <NotificationModal {...notification} onClose={()=>setNotification(null)} lang={lang} />}
                    {tutorialOpen && <TutorialModal onClose={()=>setTutorialOpen(false)} lang={lang} />}
                    {stampBookOpen && <StampBook locations={LOCATIONS} clearedLocations={cleared} bonusLocations={bonusLocs} onClose={()=>setStampBookOpen(false)} lang={lang} />}
                    {giftOpen && <GiftModal user={user} onClose={()=>setGiftOpen(false)} onSave={handleSaveAddress} lang={lang} />}

                    {activeLoc && (
                        <MissionOrchestrator 
                            location={activeLoc} 
                            user={{...user, clearedLocations: cleared, bonusLocations: bonusLocs}} 
                            content={content}
                            adminConfig={adminConfig}
                            lang={lang} 
                            onSavePoints={handleSavePoints}
                            onClose={()=>setActiveLoc(null)}
                            showNotify={showNotify}
                        />
                    )}

                    <MapScreen 
                        user={user} 
                        locations={LOCATIONS} 
                        clearedLocations={cleared} 
                        bonusLocations={bonusLocs}
                        adminConfig={adminConfig}
                        onSelectLocation={setActiveLoc}
                        onOpenStampBook={()=>setStampBookOpen(true)}
                        onOpenGift={()=>setGiftOpen(true)}
                        lang={lang} setLang={setLang} onLogout={handleLogout} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
