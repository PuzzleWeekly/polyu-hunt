                    { title: "比賽詳情", content: ["• 校內參加者: 參加者可根據遊戲內的指示去理大的不同地標尋找謎題，找到謎題後，可掃描提示板上的二維碼或輸入提示板的4位數密碼進入問題部份。參加者可任意選擇遊戲內任何節點作為起點。遊戲中總共有7個節點，玩家須先完成當中6個節點，完成6個節點後，即可解鎖最後一個節點（禮物換領處）。最快完成解謎的參加者可獲得大奬，第二至第五名完成的參加者可獲得優異獎。其他完成的參加者均可獲得神秘禮品一份。", "• 海外及校外參加者: 參加者可輸入遊戲通行碼進入遊戲，並可在遊戲地圖中點擊不同謎題進行回答。遊戲中總共有7個節點，玩家須先完成當中6個節點，完成6個個節點後，即可解鎖最後一個節點（禮物換領處）。完成遊戲後，參加者可填寫郵寄地址（非香港地址），即可獲得神秘禮品一份（以郵寄方式寄送）。"] },

                    { title: "活动时间及地点", content: ["• 校内参加者: 时间: 校友日活动（4月12日）13:00 – 17:00 | 地点: 整个校园", "• 海外及校外参加者: 时间: 校友日活动（4月12日）13:00（香港时间） | 地点: 指定网页（註：指定遊戏网页将由开始时间起保留上线24小时。）"] },
                    { title: "报名方法", content: ["• 校内参加者: 可於校友日入场接待处或遊戏内各节点扫描遊戏二维码。进入网页後登记基本资料，即可开始遊戏。", "• 海外及校外参加者: 校友会在活动前收到邀请电邮。获邀请的校友需於活动前先填妥网上表格并分享一则理大故事。提交後，校友将获得一组遊戏通行码。参加者可在活动当天利用通行码登入遊戏。"] },
                    { title: "比赛详情", content: ["• 校内参加者: 参加者可根据遊戏内的指示去理大的不同地标寻找谜题，找到谜题後，可扫描提示板上的二维码或输入提示板的4位数密码进入问题部份。参加者可任意选择遊戏内任何节点作为起点。遊戏中总共有7个节点，玩家须先完成当中6个节点，完成6个节点後，即可解锁最後一个节点（礼物换领处）。最快完成解谜的参加者可获得大奬，第二至第五名完成的参加者可获得优异奖。其他完成的参加者均可获得神秘礼品一份。", "• 海外及校外参加者: 参加者可输入遊戏通行码进入遊戏，并可在遊戏地图中点击不同谜题进行回答。遊戏中总共有7个节点，玩家须先完成当中6个节点，完成6个个节点後，即可解锁最後一个节点（礼物换领处）。完成遊戏后，参加者可填写邮寄地址（非香港地址），即可获得神秘礼品一份（以邮寄方式寄送）。"] },

        const TCModal = ({ onClose, lang }) => {

        const NotificationModal = ({ title, message, type, customIcon, onClose, lang, customAction }) => {
            const t = TRANSLATIONS[lang];
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 p-4">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-sm text-center border-t-4 border-[#A6192E]">
                        <div className={`w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 ${type==='success'?'bg-green-100 text-green-600':(type==='error'?'bg-red-100 text-red-600':'bg-blue-100 text-blue-600')}`}>

                        </div>
                        <h3 className="text-xl font-bold mb-2">{title}</h3>
                        <p className="text-gray-600 mb-4 whitespace-pre-wrap">{message}</p>

                        )}

                </div>
            );
        };

        const LocationModal = ({ location, onClose, onStartQuiz, onDebugTeleport, lang, onScanError }) => {
            const [scanStatus, setScanStatus] = useState('idle');
            const [inputCode, setInputCode] = useState('');
            const [error, setError] = useState('');
            const scannerRef = useRef(null);
            const t = TRANSLATIONS[lang];

            useEffect(() => {
                return () => {
                    if (scannerRef.current) {
                        try {
                            if (scannerRef.current.isScanning) {
                                scannerRef.current.stop().then(() => {
                                    scannerRef.current.clear();
                                }).catch(err => console.error(err));
                            } else {
                                scannerRef.current.clear();
                            }
                        } catch (e) {
                            console.error("Scanner cleanup error", e);
                        }
                    }
                };
            }, []);

            const startScanner = () => {
                if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') { alert(t.scanError); return; }
                setScanStatus('scanning');
                setTimeout(() => { 
                    const scanner = new Html5Qrcode("reader");
                    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decoded) => {
                        const expectedNew = `scan=${location.qrId}`;
                        const expectedOld = `scan=${location.id}`;
                        const expectedLegacy = `POLYU_HUNT:${location.id}`;
                        
                        if (decoded.includes(expectedNew) || decoded.includes(expectedOld) || decoded === expectedLegacy) {
                            scanner.stop().then(() => scanner.clear());
                            setScanStatus('success');
                            setTimeout(onStartQuiz, 1000);
                        } else {
                            scanner.stop().then(() => scanner.clear());
                            setScanStatus('error');
                            if (decoded.includes("scan=") || decoded.startsWith("POLYU_HUNT:")) {
                                alert(t.wrongLocation);
                            } else {
                                alert(t.invalidPin); 
                            }
                        }
                    }).catch(err => { console.error(err); setScanStatus('idle'); });
                    scannerRef.current = scanner;
                }, 100);
            };

            const checkCode = () => {
                if (inputCode.trim() === location.code) {
                    onStartQuiz();
                } else {
                    setError(t.invalidPin);
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/50 p-4 fade-in">
                    <div className="bg-white w-full md:max-w-md rounded-2xl p-6 shadow-2xl slide-up max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold">{location.name[lang]}</h2><button onClick={onClose}><i className="fa fa-times"></i></button></div>
                        
                        <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r-lg mb-6 text-left">
                            <div className="flex items-start">
                                <i className="fa fa-lightbulb text-yellow-500 mt-1 mr-3"></i>
                                <div>
                                    <h4 className="font-bold text-yellow-800 text-sm">{t.clue}</h4>
                                    <p className="text-sm text-yellow-700 italic">"{location.hint[lang]}"</p>
                                </div>
                            </div>
                        </div>

                        {scanStatus === 'idle' && <button onClick={startScanner} className="w-full bg-gray-900 text-white py-4 rounded-xl font-bold mb-4"><i className="fa fa-qrcode"></i> {t.scanBtn}</button>}
                        {scanStatus === 'scanning' && <div className="mb-4 rounded-xl overflow-hidden bg-black relative" style={{minHeight:'250px'}}>
                            <div id="reader"></div>
                            <button onClick={()=>{ if(scannerRef.current) scannerRef.current.stop(); onClose(); }} className="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-white/90 text-red-600 px-6 py-2 rounded-full font-bold shadow-lg border border-red-200 hover:bg-white transition-colors z-20">{t.cancelScan}</button>
                        </div>}
                        {scanStatus === 'error' && (
                            <div className="mb-4 p-4 bg-red-100 text-red-700 rounded-xl text-center">
                                <p className="font-bold mb-2">{t.scanFail}</p>
                                <button onClick={startScanner} className="underline font-bold">{t.tryAgain}</button>
                            </div>
                        )}
                        {scanStatus === 'success' && (
                            <div className="w-full py-4 rounded-xl font-bold shadow-lg flex items-center justify-center gap-3 bg-green-600 text-white mb-4">
                                <i className="fa fa-check-circle text-xl"></i>
                                <span>{t.verified}</span>
                            </div>
                        )}

                        <div className="bg-white border border-gray-200 rounded-xl p-4 mb-4 w-[95%] mx-auto">
                            <h3 className="font-bold text-gray-700 mb-2 text-sm">{t.enterPin}</h3>
                            <div className="flex gap-2">
                                <input 
                                    type="text" 
                                    className="input-field py-2 text-center tracking-widest font-bold uppercase" 
                                    placeholder="PIN"
                                    maxLength="4"
                                    value={inputCode}
                                    onChange={e => { setInputCode(e.target.value); setError(''); }}
                                />
                                <button onClick={checkCode} className="bg-gray-100 text-gray-800 border border-gray-300 px-4 rounded-lg font-bold hover:bg-gray-200 transition">
                                    {t.go}
                                </button>
                            </div>
                            {error && <div className="text-red-500 text-xs mt-2 font-bold"><i className="fa fa-times-circle"></i> {error}</div>}
                        </div>
                    </div>
                </div>
            );
        };

        const Register = ({ onRegister, onCheckUser, onAdminLogin, lang, setLang, onOpenTC, adminConfig }) => {
            const [step, setStep] = useState(1);
            const [version, setVersion] = useState('local');
            const [formData, setFormData] = useState({ name: '', email: '', role: 'alumni', programme: '', gradYear: '' });
            const [adminPass, setAdminPass] = useState('');
            const [showTutorial, setShowTutorial] = useState(true);
            const [shake, setShake] = useState(false);
            const [loading, setLoading] = useState(false);
            const t = TRANSLATIONS[lang];
            
            const hasScan = new URLSearchParams(window.location.search).has('scan');
            
            const isAdminName = formData.name.trim().toLowerCase().split('').map(c => c.charCodeAt(0).toString(16)).join('') === '707761646d696e';

            const triggerShake = () => { setShake(true); setTimeout(() => setShake(false), 500); };

            const handleFirstStep = async (e) => {
                e.preventDefault();
                if (isAdminName) {
                    const passHex = adminPass.trim().split('').map(c => c.charCodeAt(0).toString(16)).join('');
                    if (passHex === adminConfig.passHash) {
                        onAdminLogin();
                    } else { 
                        triggerShake(); 
                        alert('Invalid Admin Password'); 
                    }
                } else {
                    if (!formData.email) { triggerShake(); return; }
                    
                    setLoading(true);
                    const exists = await onCheckUser({ name: formData.name, email: formData.email, version }, false);
                    setLoading(false);

                    if (!exists) {
                        if (!formData.name) {
                            alert(t.required);
                            return;
                        }
                        setStep(2);
                    }
                }
            };
            
            const handleFinalRegister = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    localStorage.setItem('polyu_hunt_email', formData.email.toLowerCase().trim());
                } catch (err) {
                    console.warn('localStorage unavailable', err);
                }
                await onRegister({...formData, version});
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">
                    {showTutorial && <TutorialModal onClose={()=>setShowTutorial(false)} lang={lang} setLang={setLang} onOpenTC={onOpenTC} />}
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-8 border-[#A6192E] relative">
                        <div className="absolute top-4 right-4"><LanguageSwitcher lang={lang} setLang={setLang} /></div>
                        <div className="text-center mb-6 pt-4"><h1 className="text-3xl font-bold text-gray-800 mb-1">{t.appTitle}</h1><p className="text-sm text-gray-500">{t.subtitle}</p></div>
                        
                        {hasScan && (
                            <div className="bg-blue-50 text-blue-700 p-3 rounded-lg text-sm font-bold mb-4 flex items-start gap-3 slide-up">
                                <i className="fa fa-qrcode mt-0.5 text-lg"></i>
                                <span>{t.scannedLoginMsg}</span>
                            </div>
                        )}

                        {step === 1 ? (
                            <form onSubmit={handleFirstStep} className="space-y-4 fade-in">
                                <input placeholder={t.fullName} className="w-full p-3 border rounded-lg" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} />
                                {isAdminName ? <input required type="password" placeholder={t.password} className="w-full p-3 border rounded-lg bg-gray-50 pop-in" value={adminPass} onChange={e=>setAdminPass(e.target.value)} /> : (
                                    <div className="space-y-4">
                                        <input required placeholder={t.email} type="email" className="w-full p-3 border rounded-lg" value={formData.email} onChange={e=>setFormData({...formData, email: e.target.value})} />
                                        <div className="grid grid-cols-2 gap-2">{['local', 'overseas'].map(v => <button type="button" key={v} onClick={()=>setVersion(v)} className={`p-2 border rounded font-bold ${version===v?'border-[#A6192E] bg-red-50 text-[#A6192E]':'text-gray-400'}`}>{t[v]}</button>)}</div>
                                    </div>
                                )}
                                <button type="submit" disabled={loading} className={`w-full text-white py-3 rounded-xl font-bold shadow-lg ${shake ? 'shake' : ''} ${isAdminName?'bg-gray-800':'bg-[#A6192E]'} ${loading ? 'opacity-70' : ''}`}>
                                    {loading ? (<span><i className="fa fa-spinner fa-spin mr-2"></i>{t.processing}</span>) : (isAdminName?t.login:t.startBtn)}
                                </button>
                                {!isAdminName && <button type="button" onClick={()=>setShowTutorial(true)} className="w-full text-xs text-gray-400 hover:text-[#A6192E] underline mt-2">{t.tutorialTitle}</button>}
                            </form>
                        ) : (
                            <form onSubmit={handleFinalRegister} className="space-y-4 fade-in">
                                <h3 className="font-bold text-lg text-gray-700 mb-2">{t.role}</h3>
                                <select className="w-full p-3 border rounded-lg" value={formData.role} onChange={e=>setFormData({...formData, role: e.target.value})}>{['alumni','student','staff','visitor'].map(r=><option key={r} value={r}>{t[r]}</option>)}</select>
                                {(formData.role === 'student' || formData.role === 'alumni') && <input required placeholder={t.prog} className="w-full p-3 border rounded-lg fade-in" value={formData.programme} onChange={e=>setFormData({...formData, programme: e.target.value})} />}
                                {(formData.role === 'alumni') && <input required placeholder={t.gradYear} type="number" className="w-full p-3 border rounded-lg fade-in" value={formData.gradYear} onChange={e=>setFormData({...formData, gradYear: e.target.value})} />}
                                <button type="submit" disabled={loading} className={`w-full text-white py-3 rounded-xl font-bold shadow-lg bg-[#A6192E] ${loading ? 'opacity-70' : ''}`}>
                                    {loading ? (<span><i className="fa fa-spinner fa-spin mr-2"></i>{t.processing}</span>) : t.registerBtn}
                                </button>
                                <button type="button" onClick={()=>setStep(1)} className="w-full text-xs text-gray-400 hover:text-[#A6192E] mt-2">Back</button>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const MapScreen = ({ user, locations, clearedLocations, stamps, onOpenStampBook, onSelectLocation, onOpenAdmin, lang, setLang, onLogout, onEditProfile }) => {
            const t = TRANSLATIONS[lang];
            const isLocal = user.version === 'local';
            const clearedCount = clearedLocations.length;
            const canAccessFinal = !isLocal || clearedCount >= 6; 

            return (

                                    <i className="fa fa-user"></i>
                                </button>

                                    <h1 className="font-bold text-gray-800 leading-none mb-1 text-lg">{user.name}</h1>
                                    <span className={`text-[10px] px-2 py-0.5 rounded font-bold whitespace-nowrap ${user.version==='overseas'?'bg-blue-100 text-blue-700':'bg-red-100 text-red-700'}`}>{user.role==='admin'?t.adminMode:t[user.version]}</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <LanguageSwitcher lang={lang} setLang={setLang} />
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={onOpenStampBook} className="bg-yellow-100 text-yellow-800 px-4 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-1 border border-yellow-200 shadow-sm h-full w-24">
                                <i className="fa fa-book-open text-2xl"></i>

        const CameraBooth = ({ location, lang, onComplete }) => {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [capturedImg, setCapturedImg] = useState(null);
            const [error, setError] = useState(false);
            const t = TRANSLATIONS[lang];

            useEffect(() => {
                let stream = null;
                const startCamera = async () => {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                        }
                    } catch (err) {
                        console.error("Camera Error:", err);
                        setError(true);
                    }
                };
                startCamera();
                return () => {
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            const capture = () => {
                if (!videoRef.current) return;
                const video = videoRef.current;
                const canvas = canvasRef.current;
                
                // Set canvas to actual video resolution
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                
                // Draw Video feed onto Canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Draw Custom Game Overlay
                ctx.fillStyle = "rgba(166, 25, 46, 0.9)"; // PolyU Red Banner
                const barHeight = Math.max(100, canvas.height * 0.15);
                ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);
                
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = `bold ${Math.floor(barHeight * 0.4)}px Inter`;
                ctx.fillText("PolyU Hunt 2026", canvas.width / 2, canvas.height - barHeight * 0.65);
                
                ctx.font = `${Math.floor(barHeight * 0.25)}px Inter`;
                ctx.fillText(location.name[lang], canvas.width / 2, canvas.height - barHeight * 0.25);
                
                // Output image
                setCapturedImg(canvas.toDataURL('image/jpeg', 0.9));
            };

            const downloadImage = () => {
                const link = document.createElement('a');
                link.href = capturedImg;
                link.download = `PolyUHunt_${location.id}.jpg`;
                link.click();
            };

            const shareOrSave = async () => {
                try {
                    const res = await fetch(capturedImg);
                    const blob = await res.blob();
                    const file = new File([blob], 'polyu_hunt.jpg', { type: 'image/jpeg' });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            title: 'PolyU Hunt 2026',
                            text: `I conquered ${location.name[lang]} at PolyU Homecoming!`,
                            files: [file]
                        });
                    } else {
                        // Fallback to direct download if sharing isn't supported
                        downloadImage();
                    }
                } catch (e) {
                    console.log("Sharing failed or cancelled", e);
                    if (e.name !== 'AbortError') {
                        downloadImage();
                    }
                }
            };

                return (
                    <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-6 text-center fade-in text-white">

                            {t.skip} <i className="fa fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                );
            }

            return (
                <div className="fixed inset-0 z-50 bg-black flex flex-col fade-in">
                    {!capturedImg ? (
                        <>
                            <div className="relative flex-grow overflow-hidden flex items-center justify-center">
                                <video ref={videoRef} autoPlay playsInline muted className="absolute inset-0 w-full h-full object-cover"></video>
                                
                                {/* Live Visual Overlay */}
                                <div className="absolute bottom-0 left-0 w-full bg-[#A6192E]/90 text-white p-5 text-center">
                                    <h2 className="text-2xl font-bold tracking-wide">PolyU Hunt 2026</h2>
                                    <p className="text-sm opacity-90 mt-1">{location.name[lang]}</p>
                                </div>
                            </div>
                            <div className="bg-black p-6 flex justify-between items-center px-8">
                                <button onClick={onComplete} className="text-white opacity-70 px-4 py-2 font-bold">{t.skip}</button>
                                <button onClick={capture} className="w-16 h-16 bg-white rounded-full border-4 border-gray-300 flex items-center justify-center hover:bg-gray-200 transition transform hover:scale-105">
                                    <i className="fa fa-camera text-2xl text-black"></i>
                                </button>
                                <div className="w-16"></div> {/* Spacer for perfect centering */}
                            </div>
                        </>
                    ) : (
                        <>
                            <div className="flex-grow flex items-center justify-center bg-gray-900 p-4">
                                <img src={capturedImg} className="max-h-full max-w-full object-contain rounded shadow-2xl" alt="Captured" />

                            <div className="bg-white p-6 grid grid-cols-2 gap-4 rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.2)] slide-up">
                                <button onClick={() => setCapturedImg(null)} className="py-3 font-bold text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200 transition">
                                    <i className="fa fa-redo mr-2"></i> {t.retake}

                                    <i className="fa fa-share-alt mr-2"></i> {t.share}

                                    {t.continue} <i className="fa fa-arrow-right ml-2"></i>

                    {/* Hidden canvas for image processing */}
                    <canvas ref={canvasRef} style={{ display: 'none' }}></canvas>

        const QuizScreen = ({ location, content, onBack, onComplete, onAnswerLog, lang }) => {
            const [view, setView] = useState('q');
            const [userAnswer, setUserAnswer] = useState(null);
            
            // Track positional and click state of wrong options
            const [wrongOpts, setWrongOpts] = useState({});
            
            const [storyIndex, setStoryIndex] = useState(0);
            
            const t = TRANSLATIONS[lang];
            const qData = getQuestionData(content, location.id, lang);
            const stories = getStoriesData(content, location.id, lang);

            const handleEvade = (o) => {
                const isCorrect = String(o).trim() === String(qData.answer).trim();
                if (!isCorrect && userAnswer === null) {
                    setWrongOpts(prev => {
                        const current = prev[o] || { x: 0, y: 0 };
                        // Calculate a random jump within the container bounds
                        let newX = current.x + (Math.random() > 0.5 ? 1 : -1) * (40 + Math.random() * 40);
                        let newY = current.y + (Math.random() > 0.5 ? 1 : -1) * (40 + Math.random() * 40);
                        
                        // Soft clamping to prevent the button from completely flying off-screen
                        if (newX > 80) newX = 80; 
                        if (newX < -80) newX = -80;
                        if (newY > 80) newY = 80; 
                        if (newY < -80) newY = -80;
                        
                        return { ...prev, [o]: { x: newX, y: newY } };
                    });
                    if(onAnswerLog) onAnswerLog(location.id);
                }
            };

            const handleAnswer = (o) => {
                if (userAnswer !== null) return;
                
                const isCorrect = String(o).trim() === String(qData.answer).trim();
                if (isCorrect) {
                    setUserAnswer(o);
                    // Move to Camera Challenge on Correct Answer
                    setTimeout(() => setView('camera'), 800); 
                } else {
                    handleEvade(o);
                }

            // Switch sub-components based on internal state

                                    <div

                                        style={{ 
                                            transform: transformStyle, 
                                            transition: 'transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)' 
                                        }} 
                                        className="relative z-10"
                                    >
                                        <button 
                                            onMouseEnter={() => handleEvade(o)}
                                            onTouchStart={() => handleEvade(o)}
                                            onClick={() => handleAnswer(o)}
                                            disabled={userAnswer !== null}
                                            className={`w-full p-4 border-2 rounded-xl text-left font-medium transition-all ${btnClass}`}
                                        >
                                            <div className="flex items-center justify-between">
                                                <span>{isWrongClicked ? t.notMe : o}</span>
                                                {userAnswer === o && isCorrect && <i className="fa fa-check-circle text-green-600 text-xl"></i>}

                                        </button>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );

            // Memories/Stories View

                        <h2 className="text-xl md:text-2xl font-bold mb-1">{t.memories}</h2>
                        <p className="opacity-90 text-xs md:text-sm">{t.readStories}</p>
                    </div>
                    
                    <div className="flex-grow flex flex-col items-center justify-start pt-3 px-4 pb-4 max-w-md mx-auto w-full relative overflow-y-auto">
                        <div className="w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col relative flex-shrink-0" style={{aspectRatio: '4/5', maxHeight: '65vh'}}>
                            <img 
                                src={`./image/${location.id}_story_${storyIndex + 1}.jpeg`} 
                                alt={`Story ${storyIndex + 1}`}
                                className="w-full h-full object-cover absolute inset-0"
                                onError={(e) => { e.target.onerror = null; e.target.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDglIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNlZWVlZWUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGFsaWdubWVudC1iYXNlbGluZT0ibWlkZGxlIiBmaWxsPSIjOTk5OTk5Ij5JbWFnZSBOb3QgRm91bmQ8L3RleHQ+PC9zdmc+'; }}
                            />
                            
                            <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-6 pt-16 text-white flex flex-col justify-end min-h-[50%]">
                                <p className="italic text-sm md:text-base leading-relaxed mb-3">"{stories[storyIndex].text}"</p>

                            {storyIndex > 0 && (

                                    <i className="fa fa-chevron-left"></i>
                                </button>
                            )}
                            {storyIndex < stories.length - 1 && (
                                <button onClick={() => setStoryIndex(i => i + 1)} className="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 hover:bg-white rounded-full flex items-center justify-center text-[#A6192E] shadow-lg transition">
                                    <i className="fa fa-chevron-right"></i>
                                </button>
                            )}
                            
                            <div className="absolute top-4 left-1/2 -translate-x-1/2 flex gap-2">
                                {stories.map((_, i) => (
                                    <div key={i} className={`w-2 h-2 rounded-full shadow ${i === storyIndex ? 'bg-[#A6192E]' : 'bg-white/50'}`}></div>

                        <div className="w-full mt-4 flex-shrink-0">

                                {t.collectClose}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ onBack, allUsers, stats, lang, content, onUpdateContent, onUpdateAdminSettings, adminConfig }) => {
            const t = TRANSLATIONS[lang];
            const [tab, setTab] = useState('users'); 
            const [editLoc, setEditLoc] = useState(LOCATIONS[0].id);
            const [editLang, setEditLang] = useState('en');
            const [qText, setQText] = useState('');
            const [qOptions, setQOptions] = useState(['','','','']);
            
            const [qAnsIndex, setQAnsIndex] = useState(0); 
            
            const [storyList, setStoryList] = useState([{user:'', text:''}, {user:'', text:''}]);

            const [filterText, setFilterText] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: 'stamps', direction: 'desc' });

            const [searchEmail, setSearchEmail] = useState('');
            const [manageUserUid, setManageUserUid] = useState(null);
            const [editedUserLocations, setEditedUserLocations] = useState([]);

            const [newAdminPass, setNewAdminPass] = useState('');
            const [newStartDate, setNewStartDate] = useState(adminConfig?.startDate || getLocalYYYYMMDD());

            const manageUser = useMemo(() => {
                if (!manageUserUid) return null;
                return allUsers.find(u => u.uid === manageUserUid);
            }, [allUsers, manageUserUid]);

            useEffect(() => {
                const q = getQuestionData(content, editLoc, editLang);
                const s = getStoriesData(content, editLoc, editLang);
                setQText(q.text);
                setQOptions(q.options);
                
                let ansIdx = q.options.indexOf(q.answer);
                setQAnsIndex(ansIdx !== -1 ? ansIdx : 0);
                
                setStoryList(s);
            }, [editLoc, editLang, content]);

            useEffect(() => {
                if (tab === 'stats') {
                    const ctx = document.getElementById('roleChart');
                    if (ctx) {
                        const roleCounts = { student: 0, alumni: 0, staff: 0, visitor: 0 };
                        allUsers.forEach(u => {
                            const r = u.role || 'visitor';
                            if (roleCounts[r] !== undefined) roleCounts[r]++;
                            else roleCounts.visitor++;
                        });
                        
                        const roleData = { 
                            labels: ['Student', 'Alumni', 'Staff', 'Visitor'], 
                            datasets: [{ 
                                data: [roleCounts.student, roleCounts.alumni, roleCounts.staff, roleCounts.visitor], 
                                backgroundColor: ['#A6192E','#3B82F6','#10B981','#F59E0B'] 
                            }] 
                        };

                        if (window.myRoleChart) window.myRoleChart.destroy();
                        window.myRoleChart = new Chart(ctx, { type: 'doughnut', data: roleData });
                    }
                }
            }, [tab, allUsers]);

            const sortedAndFilteredUsers = useMemo(() => {
                let filterableUsers = allUsers;
                if (filterText) {
                    const lowerFilter = filterText.toLowerCase();
                    filterableUsers = filterableUsers.filter(u => 
                        (u.name && u.name.toLowerCase().includes(lowerFilter)) ||
                        (u.email && u.email.toLowerCase().includes(lowerFilter)) ||
                        (u.role && u.role.toLowerCase().includes(lowerFilter)) ||
                        (u.version && u.version.toLowerCase().includes(lowerFilter))
                    );
                }

                filterableUsers.sort((a, b) => {
                    let aVal, bVal;
                    switch (sortConfig.key) {
                        case 'name': aVal = a.name || ''; bVal = b.name || ''; break;
                        case 'email': aVal = a.email || ''; bVal = b.email || ''; break;
                        case 'role': aVal = a.role || ''; bVal = b.role || ''; break;
                        case 'stamps': 
                            aVal = stats.userAnswers[a.email] || 0; 
                            bVal = stats.userAnswers[b.email] || 0; 
                            break;
                        case 'startTime': aVal = a.joinedAt || ''; bVal = b.joinedAt || ''; break;
                        case 'finishTime': aVal = a.completedAt || '9999-12-31'; bVal = b.completedAt || '9999-12-31'; break;
                        case 'durationTime':
                            const getDur = (u) => (u.joinedAt && u.completedAt) ? (new Date(u.completedAt) - new Date(u.joinedAt)) : Infinity;
                            aVal = getDur(a); 
                            bVal = getDur(b);
                            break;
                        default: return 0;
                    }

                    if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                return filterableUsers;
            }, [allUsers, filterText, sortConfig, stats.userAnswers]);

            const requestSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

                const newContent = JSON.parse(JSON.stringify(content || { questions: {}, stories: {} }));
                if (!newContent.questions) newContent.questions = {};
                if (!newContent.stories) newContent.stories = {};
                
                if (!newContent.questions[editLoc]) newContent.questions[editLoc] = { text:{}, options:{}, answer:{} };
                if (!newContent.stories[editLoc]) newContent.stories[editLoc] = [];
                
                newContent.questions[editLoc].text[editLang] = qText;
                newContent.questions[editLoc].options[editLang] = qOptions;

                    newContent.stories[editLoc][i].text[editLang] = storyList[i].text;

            const downloadCSV = (data, filename) => {

                document.body.appendChild(link);
                link.click();

            const exportOverseas = () => {
                const headers = ["Name", "Email", "Role", "Stamps Completed", "Start Time", "Completed Time", "Duration", "Gift Claimed", "Shipping Address"];
                const data = [headers, ...allUsers.filter(u => u.version === 'overseas').map(u => [
                    `"${u.name || ''}"`, 
                    `"${u.email || ''}"`, 
                    `"${u.role || ''}"`, 
                    (u.clearedLocations || []).length,
                    `"${formatTime(u.joinedAt)}"`,

                    `"${formatDuration(u.joinedAt, u.completedAt)}"`,

                    u.giftRequest ? `"${u.giftRequest.address}"` : "None"
                ])];
                downloadCSV(data, "overseas_users.csv");
            };

            const exportLocal = () => {
                const headers = ["Name", "Email", "Role", "Programme", "Grad Year", "Stamps Completed", "Start Time", "Completed Time", "Duration"];
                const data = [headers, ...allUsers.filter(u => u.version === 'local').map(u => [
                    `"${u.name || ''}"`, 
                    `"${u.email || ''}"`, 
                    `"${u.role || ''}"`, 
                    `"${u.programme || '-'}"`, 
                    `"${u.gradYear || '-'}"`, 
                    (u.clearedLocations || []).length,
                    `"${formatTime(u.joinedAt)}"`,
                    `"${formatTime(u.completedAt)}"`,
                    `"${formatDuration(u.joinedAt, u.completedAt)}"`
                ])];
                downloadCSV(data, "local_users.csv");

            const handleSearchUser = () => {
                const found = allUsers.find(u => u.email.toLowerCase() === searchEmail.trim().toLowerCase());
                if (found) {
                    setManageUserUid(found.uid);
                    setEditedUserLocations(found.clearedLocations || []);
                } else {
                    setManageUserUid(null);
                    setEditedUserLocations([]);
                    alert("User not found.");

            const selectUserForEdit = (user) => {
                setSearchEmail(user.email);
                setManageUserUid(user.uid);
                setEditedUserLocations(user.clearedLocations || []);
                setTab('users');
            };

            const handleDeleteUser = async () => {
                if(!manageUser) return;
                const confirmed = window.confirm(`Are you sure you want to permanently delete account: ${manageUser.email}?`);
                if (confirmed) {
                    try {
                        const { db, doc, deleteDoc, appId } = window.FB;
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', manageUser.uid));
                        setManageUserUid(null);

                        const userAnswers = {};
                        let totalStamps = 0;
                        
                        snapshot.forEach(doc => {
                            const u = doc.data();
                            users.push(u);
                            const stampCount = (u.clearedLocations || []).length;
                            userAnswers[u.email] = stampCount;
                            totalStamps += stampCount;
                        });
                        setAllUsers(users);
                        setStats({ userAnswers, totalStamps, questionAnswers: {} });
                    }, (error) => {
                        console.error("Admin snapshot error:", error);
                    });
                    return () => unsubscribe();
                }
            }, [user?.role]);
            
            // 4. Auto Login via LocalStorage
            useEffect(() => {
                const autoLogin = async () => {
                     let savedEmail = null;
                     try {
                         savedEmail = localStorage.getItem('polyu_hunt_email');
                     } catch (e) {
                         console.warn('localStorage unavailable', e);
                     }
                     if (savedEmail && !user && !initializing) {
                         await handleCheckUser({ email: savedEmail, name: '', version: 'local' }, true);
                     }
                };
                if (!initializing) autoLogin();
            }, [initializing]);

            // 5. URL Params Watcher
            useEffect(() => {
                if (user && !initializing) {
                    const params = new URLSearchParams(window.location.search);
                    const scanId = params.get('scan');
                    if (scanId) {
                        const loc = LOCATIONS.find(l => l.qrId === scanId || l.id === scanId);
                        if (loc) {
                            const isVisible = visibleLocations.some(vl => vl.id === loc.id);
                            
                            if (!isVisible) {
                                showNotify(t.lockedTitle || "Location Locked", "This mission is not available yet. Please wait for it to be revealed!", 'error', 'fa-lock');
                            } else {
                                const isLocal = user.version === 'local';
                                const isCleared = cleared.includes(loc.id);
                                const isFinal = loc.id === 'redemption';
                                const canAccessFinal = !isLocal || cleared.length >= 6;
                                const isLocked = isFinal && !canAccessFinal && !isCleared;
                                
                                if (!isLocked && !isCleared) {
                                    setActiveLoc(loc);
                                    setView('quiz'); 
                                } else if (isLocked) {
                                    showNotify(t.lockedTitle, t.lockedMsg, 'error');
                                } else if (isCleared) {
                                    showNotify(t.alreadyClearedTitle, t.alreadyClearedMsg, 'info', loc.icon);
                                }
                            }
                        }
                        window.history.replaceState(null, '', window.location.pathname);
                    }
                }
            }, [user, initializing, cleared, t, visibleLocations]); 

            const handleCheckUser = async (data, silent = false) => {
                const { db, collection, getDocs, auth, appId, setDoc, doc, deleteDoc, deleteField } = window.FB;
                
                if (!auth || !auth.currentUser) return false;
                if (!data.email) return false;

                try {
                    const normalizedEmail = data.email.toLowerCase().trim();
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'participants'));
                    
                    let foundAny = false;
                    let mergedLocations = [];
                    let latestProfile = null;
                    const oldDocIds = [];
                    
                    snap.forEach(docSnap => {
                        const d = docSnap.data();
                        if (d.email && d.email.toLowerCase() === normalizedEmail) {
                            foundAny = true;
                            latestProfile = d; 
                            oldDocIds.push(docSnap.id);
                            
                            if (Array.isArray(d.clearedLocations)) {
                                d.clearedLocations.forEach(id => {
                                    if (!mergedLocations.includes(id)) mergedLocations.push(id);
                                });
                            }
                            if (d.missions_completed) {
                                Object.keys(d.missions_completed).forEach(id => {
                                    if (!mergedLocations.includes(id)) mergedLocations.push(id);
                                });
                            }
                        }
                    });
                    
                    if (foundAny && latestProfile) {
                        const currentUid = auth.currentUser.uid;
                        
                        let finalVersion = latestProfile.version || data.version || 'local';
                        if (data.version && latestProfile.version && data.version !== latestProfile.version) {
                            if (!silent) {
                                const modeText = latestProfile.version === 'local' ? t.local : t.overseas;
                                alert(`${t.modeMismatch} ${modeText}`);
                            }
                            finalVersion = latestProfile.version; 
                        }

                        const updatedName = (data.name && data.name.trim() !== '') ? data.name.trim() : latestProfile.name;
                        delete latestProfile.missions_completed;

                        const mergedData = { 
                            ...latestProfile, 
                            uid: currentUid, 
                            name: updatedName,
                            clearedLocations: mergedLocations,
                            lastLogin: new Date().toISOString(),
                            version: finalVersion,
                            missions_completed: deleteField() 
                        };
                        
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', currentUid), mergedData, { merge: true });

                        for (const oldId of oldDocIds) {
                            if (oldId !== currentUid) {
                                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', oldId)).catch(e => console.log("Cleanup ignored"));
                            }
                        }

                        setUser(mergedData);
                        setCleared(mergedLocations);
                        setView('map');
                        try {
                            localStorage.setItem('polyu_hunt_email', normalizedEmail);
                        } catch (e) {
                            console.warn('localStorage unavailable', e);
                        }
                        return true; 
                    }
                } catch (e) { 
                    console.error("CheckUser Error: ", e); 
                    if (!silent) alert("Error connecting to database.");
                }
                return false;
            };

            const handleRegister = async (data) => {
                const { db, doc, setDoc, auth, appId } = window.FB;
                
                const uid = auth?.currentUser?.uid || 'offline-user';
                const normalizedEmail = data.email.toLowerCase().trim();

                const newUser = { 
                    ...data, 
                    email: normalizedEmail,
                    uid, 
                    clearedLocations: [], 
                    joinedAt: new Date().toISOString(), 
                    giftClaimed: false 
                };

                if (auth && auth.currentUser && db) {
                    try {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', uid), newUser);
                    } catch (e) {
                        console.error("Save Error", e);
                    }
                }
                
                setUser(newUser);
                setCleared([]);
                setView('map');
                try {
                    localStorage.setItem('polyu_hunt_email', normalizedEmail);
                } catch (e) {
                    console.warn('localStorage unavailable', e);
                }
            };

            const handleUpdateProfile = async (updates) => {
                const { db, doc, updateDoc, appId, auth } = window.FB;
                const updatedUser = { ...user, ...updates };
                setUser(updatedUser);

                if (auth && auth.currentUser && db) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid), updates);
                }
                showNotify("Profile Updated", "Your information has been updated successfully.", "success", "fa-user-check");
            };

            const handleAdminLogin = async () => {
                const { db, doc, setDoc, auth, appId } = window.FB;
                if (auth.currentUser) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid), { name: 'Administrator', email: 'admin@system', role: 'admin', clearedLocations: [] });
                setUser({ name: 'Administrator', email: 'admin@system', role: 'admin', clearedLocations: [] });
                setView('map');
            };
            
            const handleUpdateAdminSettings = async (updates) => {
                const { db, doc, setDoc, appId } = window.FB;
                if (db) {
                    const newConfig = { ...adminConfig, ...updates };
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'content', 'admin_settings_v2'), newConfig, { merge: true });
                    alert(t.settingsSaved || "Settings updated successfully!");
                }
            };

            const handleLogout = async () => {
                const { auth, signOut } = window.FB;
                if (auth) try { await signOut(auth); } catch (e) {}
                setUser(null); setView('register'); setCleared([]); setOverseasUnlocked(false);
                try {
                    localStorage.removeItem('polyu_hunt_email');
                } catch (e) {
                    console.warn('localStorage unavailable', e);
                }
                window.location.reload();
            };

            const handleQuizComplete = async (success) => {
                if (success) {
                    const { db, doc, updateDoc, arrayUnion, appId, auth } = window.FB;
                    
                    if (cleared.includes(activeLoc.id)) {
                        showNotify(t.alreadyClearedTitle, t.alreadyClearedMsg, "info", activeLoc.icon);
                    } else {
                        const newCleared = [...cleared, activeLoc.id];
                        setCleared(newCleared);

                        const completedTime = new Date().toISOString();

                        let payloadToUpdate = {
                            clearedLocations: arrayUnion(activeLoc.id)
                        };

                        if (newCleared.length === 7) {
                            payloadToUpdate.completedAt = completedTime;
                        }

                        if (auth && auth.currentUser && db) {
                            const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid);
                            await updateDoc(userRef, payloadToUpdate);
                        }
                        
                        if (newCleared.length === 7) {
                            if (window.confetti) {
                                window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, zIndex: 9999 });
                            }
                            
                            const durationStr = formatDuration(user.joinedAt, completedTime);

                            if (user.version === 'overseas') {
                                setUser(prev => ({...prev, completedAt: completedTime}));
                                setGiftClaimOpen(true);
                            } else {
                                showNotify(t.grandSuccessTitle, `${t.grandSuccessMsg}\n\n${t.timeTaken}${durationStr}`, "success", "fa-crown");
                            }
                        } else {
                            showNotify(t.stampCollectedTitle, `${t.stampCollectedMsg} (${activeLoc.name[lang]})`, "success", activeLoc.icon);
                        }
                    }
                }
                setActiveLoc(null); setView('map');
            };

            const handleGiftSubmit = async (data) => {
                const { db, doc, updateDoc, appId, auth } = window.FB;
                if (auth && auth.currentUser && db) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid), { giftRequest: data, giftClaimed: true });
                    setUser(prev => ({ ...prev, giftClaimed: true }));
                }
            };

            const handleUpdateContent = async (newContent) => {
                const { db, doc, setDoc, appId } = window.FB;
                setContent(newContent);
                if (db) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'content', 'main'), newContent, { merge: true });
                }
            };

            const handleSelectLocation = (loc, isLocked) => {
                if (isLocked) { setNotification({ title: t.lockedTitle, message: t.lockedMsg, type: 'error' }); return; }
                if (user.version === 'overseas') { if (!overseasUnlocked) return; setActiveLoc(loc); setView('quiz'); }
                else { setActiveLoc(loc); setModalOpen(true); }
            };

            const showNotify = (title, message, type = 'info', customIcon = null, customAction = null) => {
                setNotification({ title, message, type, customIcon, customAction });
            };

            if (initializing) return <div className="min-h-screen flex items-center justify-center bg-gray-100 text-[#A6192E] font-bold"><i className="fa fa-spinner fa-spin mr-2"></i> Loading Campus...</div>;

            if(!user) {
                return (
                    <div className={`text-gray-800 lang-${lang}`}>
                        {tcOpen && <TCModal onClose={() => setTcOpen(false)} lang={lang} />}
                        <Register onRegister={handleRegister} onCheckUser={handleCheckUser} onAdminLogin={handleAdminLogin} lang={lang} setLang={setLang} onOpenTC={() => setTcOpen(true)} adminConfig={adminConfig} />
                    </div>
                );
            }

            return (
                <div className={`text-gray-800 lang-${lang}`}>
                    {tcOpen && <TCModal onClose={() => setTcOpen(false)} lang={lang} />}
                    {notification && <NotificationModal {...notification} onClose={()=>setNotification(null)} lang={lang} />}
                    
                    {stampBookOpen && <StampBook locations={visibleLocations} clearedLocations={cleared} onClose={()=>setStampBookOpen(false)} lang={lang} />}
                    {giftClaimOpen && <GiftClaimModal user={user} onClose={()=>setGiftClaimOpen(false)} onSubmit={handleGiftSubmit} lang={lang} />}
                    {profileOpen && <ProfileModal user={user} onClose={()=>setProfileOpen(false)} onUpdate={handleUpdateProfile} lang={lang} onOpenTC={() => setTcOpen(true)} />}

                    {view === 'map' && user.version === 'overseas' && !overseasUnlocked && <OverseasUnlockModal onUnlock={()=>setOverseasUnlocked(true)} lang={lang} onLogout={handleLogout} />}
                    
                    {view === 'map' && <MapScreen user={user} locations={visibleLocations} clearedLocations={cleared} stamps={cleared.length} onOpenStampBook={()=>setStampBookOpen(true)} onSelectLocation={handleSelectLocation} onOpenAdmin={()=>setView('admin')} onLogout={handleLogout} onEditProfile={()=>setProfileOpen(true)} lang={lang} setLang={setLang} />}
                    
                    {modalOpen && activeLoc && <LocationModal location={activeLoc} onClose={()=>setModalOpen(false)} onStartQuiz={()=>{setModalOpen(false); setView('quiz');}} onDebugTeleport={()=>{setModalOpen(false); setView('quiz');}} lang={lang} />}
                    {view === 'quiz' && activeLoc && <QuizScreen location={activeLoc} content={content} onBack={()=>setView('map')} onComplete={handleQuizComplete} onAnswerLog={()=>{}} lang={lang} />}
                    {view === 'admin' && <AdminDashboard onBack={()=>setView('map')} allUsers={allUsers} stats={stats} lang={lang} content={content} onUpdateContent={handleUpdateContent} onUpdateAdminSettings={handleUpdateAdminSettings} adminConfig={adminConfig} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
