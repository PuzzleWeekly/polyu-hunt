            return `${seconds}s`;

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [capturedImg, setCapturedImg] = useState(null);
            const [error, setError] = useState(false);
            const [frameLoaded, setFrameLoaded] = useState(false);
            const frameImgRef = useRef(null);
            const t = TRANSLATIONS[lang];

            useEffect(() => {
                const frame = new Image();
                frame.crossOrigin = "Anonymous";
                frame.src = `./image/frame_${location.id}.png`;
                frame.onload = () => { frameImgRef.current = frame; setFrameLoaded(true); };
                frame.onerror = () => { console.warn(`Frame ./image/frame_${location.id}.png not found.`); setFrameLoaded(true); };

                let stream = null;
                const startCamera = async () => {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                        if (videoRef.current) videoRef.current.srcObject = stream;
                    } catch (err) { setError(true); }
                };
                startCamera();
                return () => { if (stream) stream.getTracks().forEach(track => track.stop()); };
            }, [location.id]);

            const capture = () => {
                if (!videoRef.current) return;
                const video = videoRef.current;
                const canvas = canvasRef.current;
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                if (frameImgRef.current) {
                    ctx.drawImage(frameImgRef.current, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = "rgba(166, 25, 46, 0.9)";
                    const barHeight = Math.max(100, canvas.height * 0.15);
                    ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);
                    ctx.fillStyle = "white";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.font = `bold ${Math.floor(barHeight * 0.4)}px Inter`;
                    ctx.fillText("PolyU Hunt", canvas.width / 2, canvas.height - barHeight * 0.65);
                    ctx.font = `${Math.floor(barHeight * 0.25)}px Inter`;
                    ctx.fillText(location.name[lang], canvas.width / 2, canvas.height - barHeight * 0.25);
                }
                setCapturedImg(canvas.toDataURL('image/jpeg', 0.9));
            };

            const downloadImage = () => {
                const link = document.createElement('a');
                link.href = capturedImg;
                link.download = `PolyUHunt_${location.id}.jpg`;
                link.click();
            };

            const shareOrSave = async () => {
                try {
                    const res = await fetch(capturedImg);
                    const blob = await res.blob();
                    const file = new File([blob], 'polyu_hunt.jpg', { type: 'image/jpeg' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ title: 'PolyU Hunt', text: `I conquered ${location.name[lang]} at PolyU Homecoming Week!`, files: [file] });
                    } else { downloadImage(); }
                } catch (e) { if (e.name !== 'AbortError') downloadImage(); }
            };

            if (error) {
                return (
                    <div className="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center p-6 text-center fade-in text-white">
                        <i className="fa fa-camera-slash text-5xl text-gray-500 mb-4"></i>
                        <p className="mb-6">{t.camError}</p>
                        <button onClick={onClose} className="bg-[#A6192E] text-white px-8 py-3 rounded-xl font-bold shadow-lg">{t.continue} <i className="fa fa-arrow-right ml-2"></i></button>
                    </div>
                );
            }

            return (
                <div className="fixed inset-0 z-[100] bg-black flex flex-col fade-in">
                    {!capturedImg ? (
                        <>
                            <div className="relative flex-grow overflow-hidden flex items-center justify-center bg-gray-900">
                                <video ref={videoRef} autoPlay playsInline muted className="absolute inset-0 w-full h-full object-cover"></video>
                                {frameImgRef.current && <img src={frameImgRef.current.src} className="absolute inset-0 w-full h-full object-cover pointer-events-none z-10" alt="Frame Overlay" />}
                            </div>
                            <div className="bg-black p-6 flex justify-between items-center px-8 z-20">
                                <button onClick={onClose} className="text-white opacity-70 px-4 py-2 font-bold"><i className="fa fa-times text-xl"></i></button>
                                <button onClick={capture} disabled={!frameLoaded} className="w-16 h-16 bg-white rounded-full border-4 border-gray-300 flex items-center justify-center hover:bg-gray-200 transition transform hover:scale-105 disabled:opacity-50"><i className="fa fa-camera text-2xl text-black"></i></button>
                                <div className="w-16"></div> 
                            </div>
                        </>
                    ) : (
                        <>
                            <div className="flex-grow flex items-center justify-center bg-gray-900 p-4"><img src={capturedImg} className="max-h-full max-w-full object-contain rounded shadow-2xl" alt="Captured" /></div>
                            <div className="bg-white p-6 grid grid-cols-2 gap-4 rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.2)] slide-up z-20">
                                <button onClick={() => setCapturedImg(null)} className="py-3 font-bold text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200 transition"><i className="fa fa-redo mr-2"></i> {t.retake}</button>
                                <button onClick={shareOrSave} className="py-3 font-bold text-white bg-blue-500 rounded-xl shadow-lg hover:bg-blue-600 transition"><i className="fa fa-share-alt mr-2"></i> {t.share}</button>
                                <button onClick={onClose} className="col-span-2 py-4 font-bold text-white bg-[#A6192E] rounded-xl shadow-lg mt-2 text-lg hover:bg-red-800 transition">{t.continue} <i className="fa fa-arrow-right ml-2"></i></button>
                            </div>
                        </>
                    )}
                    <canvas ref={canvasRef} style={{ display: 'none' }}></canvas>
                </div>
            );
        };

        const MissionOrchestrator = ({ location, globalUnlocked, hasQuizPoint, hasQRPoint, onActivate, onProgress, onClose, content, lang }) => {
            const t = TRANSLATIONS[lang];
            const [step, setStep] = useState(globalUnlocked ? 'choice' : 'activate');
            
            const [scanStatus, setScanStatus] = useState('idle');
            const [inputCode, setInputCode] = useState('');
            const [error, setError] = useState('');
            const scannerRef = useRef(null);
            
            const [qUserAnswer, setQUserAnswer] = useState(null);
            const [wrongOpts, setWrongOpts] = useState({});
            const qData = getQuestionData(content, location.id, lang);

            useEffect(() => {
                return () => {
                    if (scannerRef.current) {
                        try {
                            if (scannerRef.current.isScanning) scannerRef.current.stop().then(() => scannerRef.current.clear()).catch(e=>console.error(e));
                            else scannerRef.current.clear();
                        } catch (e) {}
                    }
                };
            }, []);

            const stopScanner = () => { if (scannerRef.current) scannerRef.current.stop().then(() => scannerRef.current.clear()).catch(e=>console.error(e)); };

            const startScanner = (mode) => {
                if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') { alert(t.scanError); return; }
                setScanStatus('scanning');
                setTimeout(() => {
                    const scanner = new Html5Qrcode("reader");
                    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decoded) => {
                        let isValid = false;
                        if (mode === 'activate') {
                            isValid = LOCATIONS.some(l => decoded.includes(`scan=${l.qrId}`) || decoded.includes(`scan=${l.id}`) || decoded === `POLYU_HUNT:${l.id}`);
                        } else {
                            isValid = decoded.includes(`scan=${location.qrId}`) || decoded.includes(`scan=${location.id}`) || decoded === `POLYU_HUNT:${location.id}`;
                        }
                        
                        if (isValid) {
                            scanner.stop().then(() => scanner.clear());
                            setScanStatus('success');
                            setTimeout(() => {
                                if (mode === 'activate') {
                                    onActivate();
                                    setStep('choice');
                                } else {
                                    onProgress(location.id, 'qr');
                                    setStep('choice');
                                }
                            }, 1000);
                        } else {
                            scanner.stop().then(() => scanner.clear());
                            setScanStatus('error');
                            alert(mode === 'activate' ? t.invalidPin : t.wrongLocation);
                        }
                    }).catch(err => { console.error(err); setScanStatus('idle'); });
                    scannerRef.current = scanner;
                }, 100);
            };

            if (step === 'activate') {
                return (
                    <div className="fixed inset-0 z-[60] flex items-end md:items-center justify-center bg-black/50 p-4 fade-in">
                        <div className="bg-white w-full md:max-w-md rounded-2xl p-6 shadow-2xl slide-up max-h-[90vh] overflow-y-auto">
                            <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold">Game Locked</h2><button onClick={onClose}><i className="fa fa-times"></i></button></div>
                            <div className="bg-blue-50 border-l-4 border-blue-400 p-4 rounded-r-lg mb-6 text-left">
                                <div className="flex items-start"><i className="fa fa-info-circle text-blue-500 mt-1 mr-3"></i><p className="text-sm text-blue-800 font-medium">{t.globalActivateMsg}</p></div>
                            </div>
                            {scanStatus === 'idle' && <button onClick={()=>startScanner('activate')} className="w-full bg-gray-900 text-white py-4 rounded-xl font-bold mb-4"><i className="fa fa-qrcode"></i> {t.scanBtn}</button>}
                            {scanStatus === 'scanning' && <div className="mb-4 rounded-xl overflow-hidden bg-black relative" style={{minHeight:'250px'}}><div id="reader"></div><button onClick={()=>{ stopScanner(); onClose(); }} className="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-white/90 text-red-600 px-6 py-2 rounded-full font-bold shadow-lg border border-red-200 hover:bg-white transition-colors z-20">{t.cancelScan}</button></div>}
                            {scanStatus === 'error' && <div className="mb-4 p-4 bg-red-100 text-red-700 rounded-xl text-center"><p className="font-bold mb-2">{t.scanFail}</p><button onClick={()=>startScanner('activate')} className="underline font-bold">{t.tryAgain}</button></div>}
                            {scanStatus === 'success' && <div className="w-full py-4 rounded-xl font-bold shadow-lg flex items-center justify-center gap-3 bg-green-600 text-white mb-4"><i className="fa fa-check-circle text-xl"></i><span>{t.verified}</span></div>}

                            <div className="bg-white border border-gray-200 rounded-xl p-4 mb-4 w-[95%] mx-auto">
                                <h3 className="font-bold text-gray-700 mb-2 text-sm">{t.enterPin}</h3>
                                <div className="flex gap-2">
                                    <input type="text" className="input-field py-2 text-center tracking-widest font-bold uppercase" placeholder="PIN" maxLength="4" value={inputCode} onChange={e => { setInputCode(e.target.value); setError(''); }} />
                                    <button onClick={() => {
                                        const isValidPin = LOCATIONS.some(l => l.code === inputCode.trim());
                                        if (isValidPin) { onActivate(); setStep('choice'); } else { setError(t.invalidPin); }
                                    }} className="bg-gray-100 text-gray-800 border border-gray-300 px-4 rounded-lg font-bold hover:bg-gray-200 transition">{t.go}</button>
                                </div>
                                {error && <div className="text-red-500 text-xs mt-2 font-bold"><i className="fa fa-times-circle"></i> {error}</div>}
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'choice') {
                const canTakePic = hasQuizPoint || hasQRPoint;
                return (
                    <div className="fixed inset-0 z-[60] flex items-end md:items-center justify-center bg-black/50 p-4 fade-in">
                        <div className="bg-white w-full md:max-w-md rounded-2xl p-6 shadow-2xl slide-up">
                            <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-bold text-[#A6192E]">{location.name[lang]}</h2><button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa fa-times text-xl"></i></button></div>
                            <h3 className="text-lg font-bold mb-4 text-center">{t.challengeChoice}</h3>
                            <div className="space-y-4">
                                <button onClick={() => { if(!hasQRPoint){ setScanStatus('idle'); setStep('scan'); } }} className={`w-full p-4 rounded-xl font-bold shadow-lg flex items-center justify-between transition ${hasQRPoint?'bg-green-100 text-green-700':'bg-[#A6192E] text-white hover:bg-red-800 transform hover:scale-[1.02]'}`}>
                                    <span className="flex items-center gap-3"><i className="fa fa-qrcode text-2xl"></i> {hasQRPoint ? t.completedText : t.scanForBonus}</span>
                                    {hasQRPoint ? <i className="fa fa-check-circle text-xl"></i> : <i className="fa fa-chevron-right opacity-50"></i>}
                                </button>
                                <button onClick={() => { if(!hasQuizPoint) setStep('quiz'); }} className={`w-full p-4 rounded-xl font-bold shadow-lg flex items-center justify-between transition ${hasQuizPoint?'bg-green-100 text-green-700':'bg-blue-600 text-white hover:bg-blue-700 transform hover:scale-[1.02]'}`}>
                                    <span className="flex items-center gap-3"><i className="fa fa-question-circle text-2xl"></i> {hasQuizPoint ? t.completedText : t.answerForBase}</span>
                                    {hasQuizPoint ? <i className="fa fa-check-circle text-xl"></i> : <i className="fa fa-chevron-right opacity-50"></i>}
                                </button>
                                <button onClick={() => { if(canTakePic) setStep('camera'); }} disabled={!canTakePic} className={`w-full p-4 rounded-xl font-bold shadow-lg flex items-center justify-between transition ${canTakePic?'bg-purple-600 text-white hover:bg-purple-700 transform hover:scale-[1.02]':'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
                                    <span className="flex items-center gap-3"><i className="fa fa-camera text-2xl"></i> {t.takePhoto}</span>
                                    {canTakePic ? <i className="fa fa-chevron-right opacity-50"></i> : <i className="fa fa-lock text-xl"></i>}
                                </button>
                            </div>
                            <button onClick={onClose} className="w-full bg-gray-100 text-gray-600 p-4 rounded-xl font-bold shadow hover:bg-gray-200 mt-6 transition">{t.backToMap}</button>
                        </div>
                    </div>
                );
            }

            if (step === 'scan') {
                return (
                    <div className="fixed inset-0 z-[70] flex flex-col bg-black fade-in h-screen">
                        <div className="p-4 flex items-center justify-between bg-black text-white z-10"><button onClick={() => { stopScanner(); setStep('choice'); }}><i className="fa fa-arrow-left"></i> Back</button><span className="font-bold">{location.name[lang]}</span><div className="w-4"></div></div>
                        <div className="flex-grow flex flex-col justify-center items-center relative overflow-hidden">
                            {scanStatus === 'idle' && <button onClick={()=>startScanner('bonus')} className="bg-white text-black py-4 px-8 rounded-xl font-bold shadow-2xl z-20"><i className="fa fa-qrcode"></i> Start Scanner</button>}
                            {scanStatus === 'scanning' && <div id="reader" className="w-full h-full absolute inset-0"></div>}
                            {scanStatus === 'error' && <div className="p-6 bg-red-100 text-red-700 rounded-xl text-center z-20 max-w-xs"><p className="font-bold mb-4">{t.wrongLocation}</p><button onClick={()=>startScanner('bonus')} className="w-full bg-red-600 text-white py-3 rounded-lg font-bold shadow">{t.tryAgain}</button></div>}
                            {scanStatus === 'success' && <div className="p-8 rounded-xl font-bold shadow-2xl flex flex-col items-center justify-center gap-4 bg-green-500 text-white z-20 transform scale-110 pop-in"><i className="fa fa-check-circle text-6xl"></i><span className="text-2xl">+1 Point!</span></div>}
                        </div>
                    </div>
                );
            }

            if (step === 'quiz') {
                const handleEvade = (o) => {
                    const isCorrect = String(o).trim() === String(qData.answer).trim();
                    if (!isCorrect && qUserAnswer === null) {
                        setWrongOpts(prev => {
                            const current = prev[o] || { x: 0, y: 0 };
                            let newX = current.x + (Math.random() > 0.5 ? 1 : -1) * (40 + Math.random() * 60);
                            let newY = current.y + (Math.random() > 0.5 ? 1 : -1) * (40 + Math.random() * 60);
                            if (newX > 100) newX = 100; if (newX < -100) newX = -100;
                            if (newY > 100) newY = 100; if (newY < -100) newY = -100;
                            return { ...prev, [o]: { x: newX, y: newY } };
                        });
                    }
                };
                const handleAnswer = (o) => {
                    if (qUserAnswer !== null) return;
                    const isCorrect = String(o).trim() === String(qData.answer).trim();
                    if (isCorrect) {
                        setQUserAnswer(o);
                        setTimeout(() => { onProgress(location.id, 'quiz'); setStep('choice'); }, 800); 
                    } else { handleEvade(o); }
                };
                return (
                    <div className="fixed inset-0 z-[70] bg-white h-screen flex flex-col">
                        <div className="p-4 border-b flex items-center justify-between"><button onClick={() => setStep('choice')}><i className="fa fa-arrow-left text-gray-500"></i></button><span className="font-bold">{t.challenge}</span><div className="w-4"></div></div>
                        <div className="p-6 flex-grow flex flex-col justify-center overflow-x-hidden">
                            <h3 className="text-xl font-bold mb-8 text-center">{qData.text}</h3>
                            <div className="space-y-4">
                                {qData.options.map(o => {
                                    const isCorrect = String(o).trim() === String(qData.answer).trim();
                                    const wInfo = wrongOpts[o];
                                    const isWrongClicked = !!wInfo;
                                    const transformStyle = wInfo ? `translate(${wInfo.x}px, ${wInfo.y}px)` : 'none';
                                    const btnClass = qUserAnswer === o && isCorrect ? 'bg-green-100 border-green-500 text-green-700 scale-105 shadow-lg' : (isWrongClicked ? 'bg-red-50 border-red-300 text-red-500 shadow-md' : 'bg-white border-gray-200 hover:border-[#A6192E]');
                                    return (
                                        <div key={o} style={{ transform: transformStyle, transition: 'transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)' }} className="relative z-10">
                                            <button onMouseEnter={() => handleEvade(o)} onTouchStart={() => handleEvade(o)} onClick={() => handleAnswer(o)} disabled={qUserAnswer !== null} className={`w-full p-4 border-2 rounded-xl text-left font-medium transition-all ${btnClass}`}>
                                                <div className="flex items-center justify-between"><span>{isWrongClicked ? t.notMe : o}</span>{qUserAnswer === o && isCorrect && <i className="fa fa-check-circle text-green-600 text-xl"></i>}</div>
                                            </button>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'camera') return <CameraBooth location={location} lang={lang} onClose={() => setStep('choice')} />;
            return null;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('register');
            const [lang, setLang] = useState('en'); 
            const [activeMission, setActiveMission] = useState(null);
            const [notification, setNotification] = useState(null); 
            const [stampBookOpen, setStampBookOpen] = useState(false);
            const [globalUnlocked, setGlobalUnlocked] = useState(false);
            const [profileOpen, setProfileOpen] = useState(false); 
            const [tcOpen, setTcOpen] = useState(false);
            
            const [cleared, setCleared] = useState([]); 
            const [bonusLocs, setBonusLocs] = useState([]); 
            const [content, setContent] = useState({ questions: DEFAULT_QUESTIONS });
            
            const [adminConfig, setAdminConfig] = useState({ passHash: '7077686f6d65636f6d696e67706f6c79755f32303236', startDate: getLocalYYYYMMDD(), locationOrder: LOCATIONS.map(l=>l.id) }); 
            const [initializing, setInitializing] = useState(true);
            const t = TRANSLATIONS[lang];

            const locationOrder = adminConfig?.locationOrder || LOCATIONS.map(l=>l.id);
            const orderedLocations = useMemo(() => locationOrder.map(id => LOCATIONS.find(l => l.id === id)).filter(Boolean), [locationOrder]);
            const unlockedLocationIds = useMemo(() => {
                const startDateStr = adminConfig?.startDate || getLocalYYYYMMDD();
                const start = new Date(startDateStr); start.setHours(0, 0, 0, 0); 
                const now = new Date(); now.setHours(0, 0, 0, 0);
                const diffDays = Math.max(0, Math.floor((now - start) / (1000 * 60 * 60 * 24)));
                return locationOrder.slice(0, Math.min(locationOrder.length, 1 + diffDays));
            }, [adminConfig?.startDate, locationOrder]);

            useEffect(() => {
                try { if (localStorage.getItem('polyu_hunt_global_unlocked') === 'true') setGlobalUnlocked(true); } catch (e) {}
            }, []);

            useEffect(() => {
                const init = async () => {
                    try { 
                        const { auth, signInAnonymously, db, doc, getDoc, setDoc, onSnapshot, appId } = window.FB;
                        if (!auth) throw new Error("No Auth");
                        await signInAnonymously(auth); 
                        if(db) {
                            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'content', 'main');
                            const snap = await getDoc(ref);
                            if (snap.exists || (typeof snap.exists === 'function' && snap.exists())) setContent(snap.data());
                            else { await setDoc(ref, { questions: DEFAULT_QUESTIONS }, { merge: true }); setContent({ questions: DEFAULT_QUESTIONS }); }

                            const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'content', 'admin_settings_v2');
                            const configSnap = await getDoc(configRef);
                            if (!configSnap.exists && !(typeof configSnap.exists === 'function' && configSnap.exists())) {
                                await setDoc(configRef, { passHash: '7077686f6d65636f6d696e67706f6c79755f32303236', startDate: getLocalYYYYMMDD(), locationOrder: LOCATIONS.map(l=>l.id) });
                            }
                            onSnapshot(configRef, (docSnap) => {
                                if (docSnap.exists || (typeof docSnap.exists === 'function' && docSnap.exists())) setAdminConfig(docSnap.data());
                            });
                        }
                    } catch (e) { console.error("Offline/Init", e); }
                    setInitializing(false);
                };
                init();
            }, []);

            useEffect(() => {
                if (user && user.uid !== 'offline-user' && user.role !== 'admin') {
                    const { db, doc, onSnapshot, appId } = window.FB;
                    const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'participants', user.uid);
                    const unsubscribe = onSnapshot(userRef, (docSnap) => {
                        if (docSnap.exists || (typeof docSnap.exists === 'function' && docSnap.exists())) {
                            const data = docSnap.data();
                            setCleared(data.clearedLocations || []);
                            setBonusLocs(data.bonusLocations || []);
                            setUser(prev => ({...prev, ...data}));
                        }
                    });
                    return () => unsubscribe();
                }
            }, [user?.uid]);

            useEffect(() => {
                const autoLogin = async () => {
                     let savedEmail = null;
                     try { savedEmail = localStorage.getItem('polyu_hunt_email'); } catch (e) {}
                     if (savedEmail && !user && !initializing) await handleCheckUser({ email: savedEmail, name: '', version: 'local' }, true);
                };
                if (!initializing) autoLogin();
            }, [initializing]);

            useEffect(() => {
                if (user && !initializing) {
                    const params = new URLSearchParams(window.location.search);
                    const scanId = params.get('scan');
                    if (scanId) {
                        const loc = LOCATIONS.find(l => l.qrId === scanId || l.id === scanId);
                        if (loc) {
                            if (!unlockedLocationIds.includes(loc.id)) showNotify(t.lockedTitle, t.lockedMsg, 'error', 'fa-lock');
                            else {
                                setGlobalUnlocked(true);
                                try { localStorage.setItem('polyu_hunt_global_unlocked', 'true'); } catch(e){}
                                setActiveMission(loc);
                            }
                        }
                        window.history.replaceState(null, '', window.location.pathname);
                    }
                }
            }, [user, initializing, cleared, t, unlockedLocationIds]); 

            const handleCheckUser = async (data, silent = false) => {
                const { db, collection, getDocs, auth, appId, setDoc, doc, deleteDoc, deleteField } = window.FB;
                if (!auth?.currentUser || !data.email) return false;

                try {
                    const normalizedEmail = data.email.toLowerCase().trim();
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'participants'));
                    
                    let foundAny = false;
                    let mergedLocations = [];
                    let mergedBonus = [];
                    let latestProfile = null;
                    const oldDocIds = [];
                    
                    snap.forEach(docSnap => {
                        const d = docSnap.data();
                        if (d.email && d.email.toLowerCase() === normalizedEmail) {
                            foundAny = true;
                            latestProfile = d; 
                            oldDocIds.push(docSnap.id);
                            if (Array.isArray(d.clearedLocations)) d.clearedLocations.forEach(id => { if (!mergedLocations.includes(id)) mergedLocations.push(id); });
                            if (Array.isArray(d.bonusLocations)) d.bonusLocations.forEach(id => { if (!mergedBonus.includes(id)) mergedBonus.push(id); });
                        }
                    });
                    
                    if (foundAny && latestProfile) {
                        const currentUid = auth.currentUser.uid;
                        let finalVersion = latestProfile.version || data.version || 'local';
                        if (data.version && latestProfile.version && data.version !== latestProfile.version) {
                            if (!silent) alert(`${t.modeMismatch} ${latestProfile.version === 'local' ? t.local : t.overseas}`);
                            finalVersion = latestProfile.version; 
                        }
                        const updatedName = (data.name && data.name.trim() !== '') ? data.name.trim() : latestProfile.name;
                        delete latestProfile.missions_completed;

                        const mergedData = { 
                            ...latestProfile, uid: currentUid, name: updatedName,
                            clearedLocations: mergedLocations, bonusLocations: mergedBonus,
                            lastLogin: new Date().toISOString(), version: finalVersion,
                            missions_completed: deleteField() 
                        };
                        
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', currentUid), mergedData, { merge: true });
                        for (const oldId of oldDocIds) { if (oldId !== currentUid) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', oldId)).catch(e=>{}); }

                        setUser(mergedData); setCleared(mergedLocations); setBonusLocs(mergedBonus); setView('map');
                        try { localStorage.setItem('polyu_hunt_email', normalizedEmail); } catch (e) {}
                        return true; 
                    }
                } catch (e) { if (!silent) alert("Error connecting to database."); }
                return false;
            };

            const handleRegister = async (data) => {
                const { db, doc, setDoc, auth, appId } = window.FB;
                const uid = auth?.currentUser?.uid || 'offline-user';
                const normalizedEmail = data.email.toLowerCase().trim();
                const newUser = { ...data, email: normalizedEmail, uid, clearedLocations: [], bonusLocations: [], joinedAt: new Date().toISOString() };
                if (auth && auth.currentUser && db) try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', uid), newUser); } catch (e) {}
                setUser(newUser); setCleared([]); setBonusLocs([]); setView('map');
                try { localStorage.setItem('polyu_hunt_email', normalizedEmail); } catch (e) {}
            };

            const handleMissionProgress = async (locId, type) => {
                const { db, doc, updateDoc, arrayUnion, appId, auth } = window.FB;
                let payloadToUpdate = {};
                let newCleared = [...cleared];
                let newBonus = [...bonusLocs];

                if (type === 'quiz' && !cleared.includes(locId)) {
                    newCleared.push(locId); setCleared(newCleared);
                    payloadToUpdate.clearedLocations = arrayUnion(locId);
                } else if (type === 'qr' && !bonusLocs.includes(locId)) {
                    newBonus.push(locId); setBonusLocs(newBonus);
                    payloadToUpdate.bonusLocations = arrayUnion(locId);
                } else return;

                const completedTime = new Date().toISOString();
                const totalPoints = newCleared.length + newBonus.length;
                const maxPoints = LOCATIONS.length * 2;

                if (totalPoints === maxPoints) payloadToUpdate.completedAt = completedTime;
                if (auth && auth.currentUser && db) {
                    const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid);
                    await updateDoc(userRef, payloadToUpdate);
                }
                
                if (totalPoints === maxPoints) {
                    if (window.confetti) window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, zIndex: 9999 });
                    const durationStr = formatDuration(user.joinedAt, completedTime);
                    showNotify(t.grandSuccessTitle, `${t.grandSuccessMsg}\n\n${t.timeTaken}${durationStr}`, "success", "fa-crown");
                } else {
                    showNotify(t.stampCollectedTitle, t.stampCollectedMsg, "success", "fa-star");
                }
            };

            const handleLogout = async () => {
                const { auth, signOut } = window.FB;
                if (auth) try { await signOut(auth); } catch (e) {}
                setUser(null); setView('register'); setCleared([]); setGlobalUnlocked(false);
                try { localStorage.removeItem('polyu_hunt_email'); localStorage.removeItem('polyu_hunt_global_unlocked'); } catch (e) {}
                window.location.reload();
            };

            const showNotify = (title, message, type = 'info', customIcon = null, customAction = null) => {
                setNotification({ title, message, type, customIcon, customAction });
            };

            if (initializing) return <div className="min-h-screen flex items-center justify-center bg-gray-100 text-[#A6192E] font-bold"><i className="fa fa-spinner fa-spin mr-2"></i> Loading Campus...</div>;

            if(!user) {
                return (
                    <div className={`text-gray-800 lang-${lang}`}>
                        {tcOpen && <TCModal onClose={() => setTcOpen(false)} lang={lang} />}
                        <Register onRegister={handleRegister} onCheckUser={handleCheckUser} onAdminLogin={async () => {
                            const { db, doc, setDoc, auth, appId } = window.FB;
                            if (auth.currentUser) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid), { name: 'Administrator', email: 'admin@system', role: 'admin', clearedLocations: [] });
                            setUser({ name: 'Administrator', email: 'admin@system', role: 'admin', clearedLocations: [] });
                            setView('map');
                        }} lang={lang} setLang={setLang} onOpenTC={() => setTcOpen(true)} adminConfig={adminConfig} />
                    </div>
                );
            }

            const currentTotalPoints = cleared.length + bonusLocs.length;

            return (
                <div className={`text-gray-800 lang-${lang}`}>
                    {tcOpen && <TCModal onClose={() => setTcOpen(false)} lang={lang} />}
                    {notification && <NotificationModal {...notification} onClose={()=>setNotification(null)} lang={lang} />}
                    
                    {view === 'map' && (
                        <div className="flex flex-col h-screen bg-gray-50/50 backdrop-blur-sm">
                            <header className="bg-white shadow-sm px-4 py-2 z-10 grid grid-cols-[1fr_auto] gap-4 items-stretch relative">
                                <div className="flex flex-col gap-2 justify-center">
                                    <div className="flex items-center gap-3">
                                        <button onClick={()=>setProfileOpen(true)} className="w-10 h-10 bg-[#A6192E] rounded-full flex items-center justify-center text-white font-bold text-lg flex-shrink-0 hover:opacity-90 shadow-sm" title={t.myProfile}><i className="fa fa-user"></i></button>
                                        <div>
                                            <h1 className="font-bold text-gray-800 leading-none mb-1 text-lg">{user.name}</h1>
                                            <span className={`text-[10px] px-2 py-0.5 rounded font-bold whitespace-nowrap ${user.version==='overseas'?'bg-blue-100 text-blue-700':'bg-red-100 text-red-700'}`}>{user.role==='admin'?t.adminMode:t[user.version]}</span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2"><LanguageSwitcher lang={lang} setLang={setLang} /></div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="bg-yellow-100 text-yellow-800 px-4 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-1 border border-yellow-200 shadow-sm h-full w-24">
                                        <i className="fa fa-star text-2xl"></i><span>{currentTotalPoints} {t.points}</span>
                                    </div>
                                    <button onClick={handleLogout} className="w-12 h-full rounded-xl bg-gray-100 text-gray-500 flex flex-col items-center justify-center gap-1 border border-gray-200 shadow-sm hover:bg-gray-200"><i className="fa fa-sign-out-alt text-xl"></i></button>
                                </div>
                            </header>
                            <main className="flex-grow relative overflow-hidden w-full pt-0 pb-4 flex flex-col items-center justify-start">
                                <div className="map-container shadow-inner border-b border-x border-gray-300 rounded-t-none md:rounded-t-xl md:border-t md:mt-2">
                                    <img src="./image/CampusMap.png" alt="Campus Map" className="map-image" draggable="false" onError={(e) => { e.target.onerror = null; e.target.src = './image/CampusMap.png'; }} />
                                    <div className="map-overlay">
                                        {orderedLocations.map(loc => {
                                            const hasQuizPoint = cleared.includes(loc.id);
                                            const hasQRPoint = bonusLocs.includes(loc.id);
                                            const isFullyCleared = hasQuizPoint && hasQRPoint;
                                            const isPartiallyCleared = hasQuizPoint || hasQRPoint;
                                            const isDayUnlocked = unlockedLocationIds.includes(loc.id);
                                            
                                            if (!isDayUnlocked) {
                                                return (
                                                    <div key={loc.id} className="absolute flex flex-col items-center group map-pin locked" style={{left: `${loc.mapX}%`, top: `${loc.mapY}%`}} onClick={() => showNotify(t.lockedTitle, t.lockedMsg, 'error', 'fa-clock')}>
                                                        <div className="pin-icon-wrapper bg-gray-400 text-white"><i className="fa fa-lock"></i></div>
                                                        <div className="pin-label">{loc.name[lang]}</div>
                                                    </div>
                                                );
                                            }

                                            return (
                                                <div key={loc.id} className={`absolute flex flex-col items-center group map-pin cursor-pointer ${isFullyCleared?'opacity-80':''}`} style={{left: `${loc.mapX}%`, top: `${loc.mapY}%`}} onClick={() => setActiveMission(loc)}>
                                                    <div className={`pin-icon-wrapper ${isFullyCleared?'bg-green-500 text-white':(isPartiallyCleared?'bg-yellow-500 text-white':'bg-[#A6192E] text-white')}`}>
                                                        <i className={`fa ${isFullyCleared?'fa-check-double':(isPartiallyCleared?'fa-check':loc.icon)}`}></i>
                                                    </div>
                                                    <div className="pin-label">{loc.name[lang]}</div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </main>
                            {user.role === 'admin' && <div className="bg-white border-t p-4"><p className="text-xs text-center text-gray-500 mb-2">Open <a href="./admin.html" className="text-blue-500 underline font-bold">admin.html</a> to manage game.</p></div>}
                        </div>
                    )}
                    
                    {activeMission && (
                        <MissionOrchestrator 
                            location={activeMission} 
                            globalUnlocked={globalUnlocked} 
                            hasQuizPoint={cleared.includes(activeMission.id)}
                            hasQRPoint={bonusLocs.includes(activeMission.id)}
                            onActivate={() => { setGlobalUnlocked(true); try { localStorage.setItem('polyu_hunt_global_unlocked', 'true'); } catch(e){} }} 
                            onProgress={handleMissionProgress} 
                            onClose={() => setActiveMission(null)} 
                            content={content} 
                            lang={lang} 
                        />
                    )}

                    {profileOpen && <ProfileModal user={user} onClose={()=>setProfileOpen(false)} onUpdate={async (updates) => {
                        const { db, doc, updateDoc, appId, auth } = window.FB;
                        setUser({ ...user, ...updates });
                        if (auth && auth.currentUser && db) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid), updates);
                        showNotify("Profile Updated", "Your information has been updated successfully.", "success", "fa-user-check");
                    }} lang={lang} onOpenTC={() => setTcOpen(true)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
