            overflow: hidden;
            border-radius: 1rem;

            flex-shrink: 0;
            /* Container Queries */
            container-type: inline-size; 
        }

        .map-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Guarantees no sub-pixel gaps on container boundaries */
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

            position: absolute;
            inset: 0;
        }

            position: absolute;
            transform: translate(-50%, -100%);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .map-pin:hover { transform: translate(-50%, -120%) scale(1.1); z-index: 20; }
        .map-pin.locked { filter: grayscale(100%); opacity: 0.8; }

                    { title: "报名方法", content: ["• 校内参加者: 可於校友日入场接待处或遊戏内各节点扫描遊戏二维码。进入网页後登记基本资料，即可开始遊戏。", "• 海外及校外参加者: 校友会在活动前收到邀请电邮。获邀请的校友需於活动前先填妥网上表格并分享一则理大故事。提交後，校友将获得一组遊戏通行码。参加者可在活动当天利用通行码登入遊戏。"] },
                    { title: "比赛详情", content: ["• 校内参加者: 参加者可根据遊戏内的指示去理大的不同地标寻找谜题，找到谜题後，可扫描提示板上的二维码或输入提示板的4位数密码进入问题部份。参加者可任意选择遊戏内任何节点作为起点。", "• 海外及校外参加者: 参加者可输入遊戏通行码进入遊戏，并可在遊戏地图中点击不同谜题进行回答。"] },
                    { title: "奖项", content: ["• 校内参加者: 比赛设大奖一名（唯港荟GREEN餐厅电子餐饮礼券）及优异奖四名，其他完成遊戏的参加者均可获得神秘礼品一份。", "• 海外及校外参加者: 完成遊戏者均可获得神秘礼品一份。（礼品将以邮寄方式寄送给得参加者）"] },
                    { title: "结果公布及颁奖", content: ["大奖及优异奖将於4月12日校友日闭幕礼中颁发，请中奖者预留时间出席。"] }
                ],
                disclaimer: "* 主办单位保留修改细则或暂停本活动之权利，恕不另行通知。如有任何争议，概以主办单位作出的决定为最终决定。"
            }
        };

        const TCModal = ({ onClose, lang }) => {
            const content = TC_CONTENT[lang] || TC_CONTENT.en;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 relative pop-in max-h-[80vh] flex flex-col">
                        <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200">
                            <i className="fa fa-times"></i>
                        </button>
                        <h2 className="text-2xl font-bold mb-4 text-[#A6192E] text-center">{content.title}</h2>
                        <div className="overflow-y-auto flex-grow text-sm text-gray-700 space-y-5 pr-4 text-left">
                            {content.sections.map((sec, idx) => (
                                <div key={idx}>
                                    <h3 className="font-bold text-gray-900 mb-1">{sec.title}</h3>
                                    {sec.content.map((p, pIdx) => (
                                        <p key={pIdx} className="mb-1 leading-relaxed">{p}</p>
                                    ))}
                                </div>
                            ))}
                            <p className="italic text-xs text-gray-500 mt-4 border-t pt-4">{content.disclaimer}</p>
                        </div>
                    </div>
                </div>
            );
        };

        const NotificationModal = ({ title, message, type, customIcon, onClose, lang, customAction }) => {
            const t = TRANSLATIONS[lang];
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 p-4 fade-in">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-sm text-center border-t-4 border-[#A6192E] pop-in shadow-2xl">
                        <div className={`w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 ${type==='success'?'bg-green-100 text-green-600':(type==='error'?'bg-red-100 text-red-600':'bg-blue-100 text-blue-600')}`}>
                            <i className={`fa ${customIcon || (type==='success'?'fa-trophy':type==='error'?'fa-lock':'fa-info')}`}></i>
                        </div>
                        <h3 className="text-xl font-bold mb-2">{title}</h3>
                        <p className="text-gray-600 mb-4 whitespace-pre-wrap">{message}</p>
                        {customAction ? customAction : (
                            <button onClick={onClose} className="w-full bg-[#A6192E] text-white py-3 rounded-xl font-bold shadow-lg hover:opacity-90">{t.go || 'OK'}</button>
                        )}
                    </div>
                </div>
            );
        };

        // NEW: Camera Booth
        const CameraBooth = ({ location, lang, onComplete }) => {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [capturedImg, setCapturedImg] = useState(null);
            const [error, setError] = useState(false);
            const [frameLoaded, setFrameLoaded] = useState(false);
            const frameImgRef = useRef(null);
            const t = TRANSLATIONS[lang];

            useEffect(() => {
                // Preload frame
                const frame = new Image();
                frame.crossOrigin = "Anonymous";
                frame.src = `./image/frame_${location.id}.png`;
                frame.onload = () => {
                    frameImgRef.current = frame;
                    setFrameLoaded(true);
                };
                frame.onerror = () => {
                    console.warn(`Frame ./image/frame_${location.id}.png not found. Using default overlay.`);
                    setFrameLoaded(true); 
                };

                let stream = null;
                const startCamera = async () => {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                        }
                    } catch (err) {
                        console.error("Camera Error:", err);
                        setError(true);
                    }
                };
                startCamera();
                return () => {
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                    }
                };
            }, [location.id]);

            const capture = () => {
                if (!videoRef.current) return;
                const video = videoRef.current;
                const canvas = canvasRef.current;
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                
                // Draw Video
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Draw Frame if exists
                if (frameImgRef.current) {
                    ctx.drawImage(frameImgRef.current, 0, 0, canvas.width, canvas.height);
                } else {
                    // Fallback default frame drawing
                    ctx.fillStyle = "rgba(166, 25, 46, 0.9)";
                    const barHeight = Math.max(100, canvas.height * 0.15);
                    ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);
                    
                    ctx.fillStyle = "white";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.font = `bold ${Math.floor(barHeight * 0.4)}px Inter`;
                    ctx.fillText("PolyU Hunt", canvas.width / 2, canvas.height - barHeight * 0.65);
                    
                    ctx.font = `${Math.floor(barHeight * 0.25)}px Inter`;
                    ctx.fillText(location.name[lang], canvas.width / 2, canvas.height - barHeight * 0.25);
                }
                
                setCapturedImg(canvas.toDataURL('image/jpeg', 0.9));
            };

            const downloadImage = () => {
                const link = document.createElement('a');
                link.href = capturedImg;
                link.download = `PolyUHunt_${location.id}.jpg`;
                link.click();
            };

            const shareOrSave = async () => {
                try {
                    const res = await fetch(capturedImg);
                    const blob = await res.blob();
                    const file = new File([blob], 'polyu_hunt.jpg', { type: 'image/jpeg' });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            title: 'PolyU Hunt',
                            text: `I conquered ${location.name[lang]} at PolyU Homecoming Week!`,
                            files: [file]
                        });
                    } else {
                        downloadImage();
                    }
                } catch (e) {
                    console.log("Sharing failed or cancelled", e);
                    if (e.name !== 'AbortError') {
                        downloadImage();
                    }
                }
            };

            if (error) {
                return (
                    <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-6 text-center fade-in text-white">
                        <i className="fa fa-camera-slash text-5xl text-gray-500 mb-4"></i>
                        <p className="mb-6">{t.camError}</p>
                        <button onClick={onComplete} className="bg-[#A6192E] text-white px-8 py-3 rounded-xl font-bold shadow-lg">
                            {t.skipPhoto} <i className="fa fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                );
            }

            return (
                <div className="fixed inset-0 z-50 bg-black flex flex-col fade-in">
                    {!capturedImg ? (
                        <>
                            <div className="relative flex-grow overflow-hidden flex items-center justify-center bg-gray-900">
                                <video ref={videoRef} autoPlay playsInline muted className="absolute inset-0 w-full h-full object-cover"></video>
                                {frameImgRef.current && (
                                    <img src={frameImgRef.current.src} className="absolute inset-0 w-full h-full object-cover pointer-events-none z-10" alt="Frame Overlay" />
                                )}
                                {!frameImgRef.current && (
                                    <div className="absolute bottom-0 left-0 w-full bg-[#A6192E]/90 text-white p-5 text-center z-10">
                                        <h2 className="text-2xl font-bold tracking-wide">PolyU Hunt</h2>
                                        <p className="text-sm opacity-90 mt-1">{location.name[lang]}</p>
                                    </div>
                                )}
                            </div>
                            <div className="bg-black p-6 flex justify-between items-center px-8 z-20">
                                <button onClick={onComplete} className="text-white opacity-70 px-4 py-2 font-bold">{t.skipPhoto}</button>
                                <button onClick={capture} disabled={!frameLoaded} className="w-16 h-16 bg-white rounded-full border-4 border-gray-300 flex items-center justify-center hover:bg-gray-200 transition transform hover:scale-105 disabled:opacity-50">
                                    <i className="fa fa-camera text-2xl text-black"></i>
                                </button>
                                <div className="w-16"></div> 
                            </div>
                        </>
                    ) : (
                        <>
                            <div className="flex-grow flex items-center justify-center bg-gray-900 p-4">
                                <img src={capturedImg} className="max-h-full max-w-full object-contain rounded shadow-2xl" alt="Captured" />
                            </div>
                            <div className="bg-white p-6 grid grid-cols-2 gap-4 rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.2)] slide-up z-20">
                                <button onClick={() => setCapturedImg(null)} className="py-3 font-bold text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200 transition">
                                    <i className="fa fa-redo mr-2"></i> {t.retake}
                                </button>
                                <button onClick={shareOrSave} className="py-3 font-bold text-white bg-blue-500 rounded-xl shadow-lg hover:bg-blue-600 transition">
                                    <i className="fa fa-share-alt mr-2"></i> {t.share}
                                </button>
                                <button onClick={onComplete} className="col-span-2 py-4 font-bold text-white bg-[#A6192E] rounded-xl shadow-lg mt-2 text-lg hover:bg-red-800 transition">
                                    {t.continue} <i className="fa fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        </>
                    )}
                    <canvas ref={canvasRef} style={{ display: 'none' }}></canvas>
                </div>
            );
        };

        const MissionOrchestrator = ({ location, globalUnlocked, onActivate, onComplete, onCancel, content, lang }) => {
            const t = TRANSLATIONS[lang];
            const [step, setStep] = useState(globalUnlocked ? 'choice' : 'activate');
            const [earnedBonus, setEarnedBonus] = useState(false);
            
            // Reused states for child screens
            const [scanStatus, setScanStatus] = useState('idle');
            const [inputCode, setInputCode] = useState('');
            const [error, setError] = useState('');
            const scannerRef = useRef(null);
            
            const [qUserAnswer, setQUserAnswer] = useState(null);
            const [wrongOpts, setWrongOpts] = useState({});
            const qData = getQuestionData(content, location.id, lang);
            
            const [storyIndex, setStoryIndex] = useState(0);
            const stories = getStoriesData(content, location.id, lang);

            // Cleanup scanner on unmount
            useEffect(() => {
                return () => {
                    if (scannerRef.current) {
                        try {
                            if (scannerRef.current.isScanning) {
                                scannerRef.current.stop().then(() => scannerRef.current.clear()).catch(e=>console.error(e));
                            } else {
                                scannerRef.current.clear();
                            }
                        } catch (e) {}
                    }
                };
            }, []);

            const stopScanner = () => {
                if (scannerRef.current) {
                    scannerRef.current.stop().then(() => scannerRef.current.clear()).catch(e=>console.error(e));
                }
            };

            const startScanner = (mode) => {
                if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') { alert(t.scanError); return; }
                setScanStatus('scanning');
                setTimeout(() => {
                    const scanner = new Html5Qrcode("reader");
                    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decoded) => {
                        let isValid = false;
                        if (mode === 'activate') {
                            // Any valid code works for global activation
                            isValid = LOCATIONS.some(l => decoded.includes(`scan=${l.qrId}`) || decoded.includes(`scan=${l.id}`) || decoded === `POLYU_HUNT:${l.id}`);
                        } else {
                            // Must be THIS location's code for bonus
                            isValid = decoded.includes(`scan=${location.qrId}`) || decoded.includes(`scan=${location.id}`) || decoded === `POLYU_HUNT:${location.id}`;
                        }
                        
                        if (isValid) {
                            scanner.stop().then(() => scanner.clear());
                            setScanStatus('success');
                            setTimeout(() => {
                                if (mode === 'activate') {
                                    onActivate();
                                    setStep('choice');
                                } else {
                                    setEarnedBonus(true);
                                    setStep('photo_prompt');
                                }
                            }, 1000);
                        } else {
                            scanner.stop().then(() => scanner.clear());
                            setScanStatus('error');
                            alert(mode === 'activate' ? t.invalidPin : t.wrongLocation);
                        }
                    }).catch(err => { console.error(err); setScanStatus('idle'); });
                    scannerRef.current = scanner;
                }, 100);
            };

            // 1. Activation Screen
            if (step === 'activate') {
                return (
                    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/50 p-4 fade-in">
                        <div className="bg-white w-full md:max-w-md rounded-2xl p-6 shadow-2xl slide-up max-h-[90vh] overflow-y-auto">
                            <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold">Game Locked</h2><button onClick={onCancel}><i className="fa fa-times"></i></button></div>
                            
                            <div className="bg-blue-50 border-l-4 border-blue-400 p-4 rounded-r-lg mb-6 text-left">
                                <div className="flex items-start">
                                    <i className="fa fa-info-circle text-blue-500 mt-1 mr-3"></i>
                                    <p className="text-sm text-blue-800 font-medium">{t.globalActivateMsg}</p>
                                </div>
                            </div>

                            {scanStatus === 'idle' && <button onClick={()=>startScanner('activate')} className="w-full bg-gray-900 text-white py-4 rounded-xl font-bold mb-4"><i className="fa fa-qrcode"></i> {t.scanBtn}</button>}
                            {scanStatus === 'scanning' && <div className="mb-4 rounded-xl overflow-hidden bg-black relative" style={{minHeight:'250px'}}>
                                <div id="reader"></div>
                                <button onClick={()=>{ stopScanner(); onCancel(); }} className="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-white/90 text-red-600 px-6 py-2 rounded-full font-bold shadow-lg border border-red-200 hover:bg-white transition-colors z-20">{t.cancelScan}</button>
                            </div>}
                            {scanStatus === 'error' && (
                                <div className="mb-4 p-4 bg-red-100 text-red-700 rounded-xl text-center">
                                    <p className="font-bold mb-2">{t.scanFail}</p>
                                    <button onClick={()=>startScanner('activate')} className="underline font-bold">{t.tryAgain}</button>
                                </div>
                            )}
                            {scanStatus === 'success' && (
                                <div className="w-full py-4 rounded-xl font-bold shadow-lg flex items-center justify-center gap-3 bg-green-600 text-white mb-4">
                                    <i className="fa fa-check-circle text-xl"></i><span>{t.verified}</span>
                                </div>
                            )}

                            <div className="bg-white border border-gray-200 rounded-xl p-4 mb-4 w-[95%] mx-auto">
                                <h3 className="font-bold text-gray-700 mb-2 text-sm">{t.enterPin}</h3>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        className="input-field py-2 text-center tracking-widest font-bold uppercase" 
                                        placeholder="PIN" maxLength="4" value={inputCode} onChange={e => { setInputCode(e.target.value); setError(''); }}
                                    />
                                    <button onClick={() => {
                                        const isValidPin = LOCATIONS.some(l => l.code === inputCode.trim());
                                        if (isValidPin) { onActivate(); setStep('choice'); } else { setError(t.invalidPin); }
                                    }} className="bg-gray-100 text-gray-800 border border-gray-300 px-4 rounded-lg font-bold hover:bg-gray-200 transition">
                                        {t.go}
                                    </button>
                                </div>
                                {error && <div className="text-red-500 text-xs mt-2 font-bold"><i className="fa fa-times-circle"></i> {error}</div>}
                            </div>
                        </div>
                    </div>
                );
            }

            // 2. Choice Screen (QR vs Quiz)
            if (step === 'choice') {
                return (
                    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/50 p-4 fade-in">
                        <div className="bg-white w-full md:max-w-md rounded-2xl p-6 shadow-2xl slide-up">
                            <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-bold text-[#A6192E]">{location.name[lang]}</h2><button onClick={onCancel} className="text-gray-400 hover:text-gray-600"><i className="fa fa-times text-xl"></i></button></div>
                            <h3 className="text-lg font-bold mb-4 text-center">{t.challengeChoice}</h3>
                            
                            <div className="space-y-4">
                                <button onClick={() => { setScanStatus('idle'); setStep('scan'); }} className="w-full bg-[#A6192E] text-white p-4 rounded-xl font-bold shadow-lg flex items-center justify-between hover:bg-red-800 transition transform hover:scale-[1.02]">
                                    <span className="flex items-center gap-3"><i className="fa fa-qrcode text-2xl"></i> {t.scanForBonus}</span>
                                    <i className="fa fa-chevron-right opacity-50"></i>
                                </button>
                                <button onClick={() => setStep('quiz')} className="w-full bg-blue-600 text-white p-4 rounded-xl font-bold shadow-lg flex items-center justify-between hover:bg-blue-700 transition transform hover:scale-[1.02]">
                                    <span className="flex items-center gap-3"><i className="fa fa-question-circle text-2xl"></i> {t.answerForBase}</span>
                                    <i className="fa fa-chevron-right opacity-50"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // 3. Scan Bonus Screen
            if (step === 'scan') {
                return (
                    <div className="fixed inset-0 z-50 flex flex-col bg-black fade-in h-screen">
                        <div className="p-4 flex items-center justify-between bg-black text-white z-10">
                            <button onClick={() => { stopScanner(); setStep('choice'); }}><i className="fa fa-arrow-left"></i> Back</button>
                            <span className="font-bold">{location.name[lang]}</span>
                            <div className="w-4"></div>
                        </div>
                        <div className="flex-grow flex flex-col justify-center items-center relative overflow-hidden">
                            {scanStatus === 'idle' && <button onClick={()=>startScanner('bonus')} className="bg-white text-black py-4 px-8 rounded-xl font-bold shadow-2xl z-20"><i className="fa fa-qrcode"></i> Start Scanner</button>}
                            {scanStatus === 'scanning' && <div id="reader" className="w-full h-full absolute inset-0"></div>}
                            {scanStatus === 'error' && (
                                <div className="p-6 bg-red-100 text-red-700 rounded-xl text-center z-20 max-w-xs">
                                    <p className="font-bold mb-4">{t.wrongLocation}</p>
                                    <button onClick={()=>startScanner('bonus')} className="w-full bg-red-600 text-white py-3 rounded-lg font-bold shadow">{t.tryAgain}</button>
                                </div>
                            )}
                            {scanStatus === 'success' && (
                                <div className="p-8 rounded-xl font-bold shadow-2xl flex flex-col items-center justify-center gap-4 bg-green-500 text-white z-20 transform scale-110 pop-in">
                                    <i className="fa fa-check-circle text-6xl"></i>
                                    <span className="text-2xl">+2 Points!</span>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // 4. Quiz Screen (Evading Button Logic)
            if (step === 'quiz') {
                const handleEvade = (o) => {
                    const isCorrect = String(o).trim() === String(qData.answer).trim();
                    if (!isCorrect && qUserAnswer === null) {
                        setWrongOpts(prev => {
                            const current = prev[o] || { x: 0, y: 0 };
                            let newX = current.x + (Math.random() > 0.5 ? 1 : -1) * (40 + Math.random() * 60);
                            let newY = current.y + (Math.random() > 0.5 ? 1 : -1) * (40 + Math.random() * 60);
                            
                            // Constrain bounds so it doesn't leave the screen entirely
                            if (newX > 100) newX = 100; if (newX < -100) newX = -100;
                            if (newY > 100) newY = 100; if (newY < -100) newY = -100;
                            
                            return { ...prev, [o]: { x: newX, y: newY } };
                        });
                    }
                };

                const handleAnswer = (o) => {
                    if (qUserAnswer !== null) return;
                    const isCorrect = String(o).trim() === String(qData.answer).trim();
                    if (isCorrect) {
                        setQUserAnswer(o);
                        setTimeout(() => {
                            setEarnedBonus(false);
                            setStep('photo_prompt');
                        }, 800); 
                    } else {
                        handleEvade(o);
                    }
                };

                return (
                    <div className="fixed inset-0 z-50 bg-white h-screen flex flex-col">
                        <div className="p-4 border-b flex items-center justify-between"><button onClick={() => setStep('choice')}><i className="fa fa-arrow-left text-gray-500"></i></button><span className="font-bold">{t.challenge}</span><div className="w-4"></div></div>
                        <div className="p-6 flex-grow flex flex-col justify-center overflow-x-hidden">
                            <h3 className="text-xl font-bold mb-8 text-center">{qData.text}</h3>
                            <div className="space-y-4">
                                {qData.options.map(o => {
                                    const isCorrect = String(o).trim() === String(qData.answer).trim();
                                    const wInfo = wrongOpts[o];
                                    const isWrongClicked = !!wInfo;
                                    const transformStyle = wInfo ? `translate(${wInfo.x}px, ${wInfo.y}px)` : 'none';
                                    
                                    const btnClass = qUserAnswer === o && isCorrect 
                                        ? 'bg-green-100 border-green-500 text-green-700 scale-105 shadow-lg' 
                                        : (isWrongClicked 
                                            ? 'bg-red-50 border-red-300 text-red-500 shadow-md' 
                                            : 'bg-white border-gray-200 hover:border-[#A6192E]');

                                    return (
                                        <div key={o} style={{ transform: transformStyle, transition: 'transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)' }} className="relative z-10">
                                            <button 
                                                onMouseEnter={() => handleEvade(o)}
                                                onTouchStart={() => handleEvade(o)}
                                                onClick={() => handleAnswer(o)}
                                                disabled={qUserAnswer !== null}
                                                className={`w-full p-4 border-2 rounded-xl text-left font-medium transition-all ${btnClass}`}
                                            >
                                                <div className="flex items-center justify-between">
                                                    <span>{isWrongClicked ? t.notMe : o}</span>
                                                    {qUserAnswer === o && isCorrect && <i className="fa fa-check-circle text-green-600 text-xl"></i>}
                                                </div>
                                            </button>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            // 5. Photo Prompt Screen
            if (step === 'photo_prompt') {
                return (
                    <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 p-4 fade-in">
                        <div className="bg-white rounded-2xl p-8 w-full max-w-sm text-center border-t-8 border-[#A6192E] shadow-2xl pop-in">
                            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i className="fa fa-camera text-4xl text-green-600"></i>
                            </div>
                            <h3 className="text-2xl font-bold mb-2">{t.photoPromptTitle}</h3>
                            <p className="text-gray-600 mb-6">{t.photoPromptMsg}</p>
                            
                            <button onClick={() => setStep('camera')} className="w-full bg-[#A6192E] text-white py-3 rounded-xl font-bold shadow-lg hover:bg-red-800 transition mb-3">
                                <i className="fa fa-camera mr-2"></i> {t.takePhoto}
                            </button>
                            <button onClick={() => setStep('story')} className="w-full bg-gray-100 text-gray-600 py-3 rounded-xl font-bold shadow hover:bg-gray-200 transition">
                                {t.skipPhoto}
                            </button>
                        </div>
                    </div>
                );
            }

            // 6. Camera Booth Screen
            if (step === 'camera') {
                return <CameraBooth location={location} lang={lang} onComplete={() => setStep('story')} />;
            }

            // 7. Story Screen
            if (step === 'story') {
                return (
                    <div className="fixed inset-0 z-50 bg-gray-100 h-screen flex flex-col fade-in">
                        <div className="bg-[#A6192E] text-white p-4 md:p-6 text-center rounded-b-3xl shadow-lg relative z-10 flex-shrink-0">
                            <h2 className="text-xl md:text-2xl font-bold mb-1">{t.memories}</h2>
                            <p className="opacity-90 text-xs md:text-sm">{t.readStories}</p>
                        </div>
                        
                        <div className="flex-grow flex flex-col items-center justify-start pt-3 px-4 pb-4 max-w-md mx-auto w-full relative overflow-y-auto">
                            <div className="w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col relative flex-shrink-0" style={{aspectRatio: '4/5', maxHeight: '65vh'}}>
                                <img 
                                    src={`./image/${location.id}_story_${storyIndex + 1}.jpeg`} 
                                    alt={`Story ${storyIndex + 1}`}
                                    className="w-full h-full object-cover absolute inset-0"
                                    onError={(e) => { e.target.onerror = null; e.target.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDglIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNlZWVlZWUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGFsaWdubWVudC1iYXNlbGluZT0ibWlkZGxlIiBmaWxsPSIjOTk5OTk5Ij5JbWFnZSBOb3QgRm91bmQ8L3RleHQ+PC9zdmc+'; }}
                                />
                                
                                <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-6 pt-16 text-white flex flex-col justify-end min-h-[50%]">
                                    <p className="italic text-sm md:text-base leading-relaxed mb-3">"{stories[storyIndex].text}"</p>
                                </div>
                                
                                {storyIndex > 0 && (
                                    <button onClick={() => setStoryIndex(i => i - 1)} className="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 hover:bg-white rounded-full flex items-center justify-center text-[#A6192E] shadow-lg transition">
                                        <i className="fa fa-chevron-left"></i>
                                    </button>
                                )}
                                {storyIndex < stories.length - 1 && (
                                    <button onClick={() => setStoryIndex(i => i + 1)} className="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 hover:bg-white rounded-full flex items-center justify-center text-[#A6192E] shadow-lg transition">
                                        <i className="fa fa-chevron-right"></i>
                                    </button>
                                )}
                                
                                <div className="absolute top-4 left-1/2 -translate-x-1/2 flex gap-2">
                                    {stories.map((_, i) => (
                                        <div key={i} className={`w-2 h-2 rounded-full shadow ${i === storyIndex ? 'bg-[#A6192E]' : 'bg-white/50'}`}></div>
                                    ))}
                                </div>
                            </div>

                            <div className="w-full mt-4 flex-shrink-0">
                                <button onClick={()=>onComplete(location.id, earnedBonus)} className="w-full bg-[#A6192E] text-white py-4 rounded-xl font-bold shadow-lg hover:bg-red-800 transition">
                                    {t.collectClose}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }
            
            return null;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('register');
            const [lang, setLang] = useState('en'); 
            const [activeMission, setActiveMission] = useState(null);
            const [notification, setNotification] = useState(null); 
            const [stampBookOpen, setStampBookOpen] = useState(false);
            const [globalUnlocked, setGlobalUnlocked] = useState(false);
            const [giftClaimOpen, setGiftClaimOpen] = useState(false); 
            const [profileOpen, setProfileOpen] = useState(false); 
            const [tcOpen, setTcOpen] = useState(false);
            
            const [allUsers, setAllUsers] = useState([]);
            const [stats, setStats] = useState({ userAnswers: {}, totalPoints: 0 });
            const [cleared, setCleared] = useState([]); 
            const [bonusLocs, setBonusLocs] = useState([]); 
            const [content, setContent] = useState({ questions: DEFAULT_QUESTIONS, stories: ALUMNI_STORIES });
            
            const [adminConfig, setAdminConfig] = useState({ passHash: '7077686f6d65636f6d696e67706f6c79755f32303236', startDate: getLocalYYYYMMDD(), locationOrder: LOCATIONS.map(l=>l.id) }); 
            const [initializing, setInitializing] = useState(true);
            const t = TRANSLATIONS[lang];

            const locationOrder = adminConfig?.locationOrder || LOCATIONS.map(l=>l.id);
            const orderedLocations = useMemo(() => {
                return locationOrder.map(id => LOCATIONS.find(l => l.id === id)).filter(Boolean);
            }, [locationOrder]);

            const unlockedLocationIds = useMemo(() => {
                const startDateStr = adminConfig?.startDate || getLocalYYYYMMDD();
                const start = new Date(startDateStr);
                start.setHours(0, 0, 0, 0); 
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                
                const diffDays = Math.max(0, Math.floor((now - start) / (1000 * 60 * 60 * 24)));
                return locationOrder.slice(0, Math.min(locationOrder.length, 1 + diffDays));
            }, [adminConfig?.startDate, locationOrder]);

            useEffect(() => {
                try {
                    const isUnlocked = localStorage.getItem('polyu_hunt_global_unlocked') === 'true';
                    if (isUnlocked) setGlobalUnlocked(true);
                } catch (e) {}
            }, []);

            useEffect(() => {
                const init = async () => {
                    try { 
                        const { auth, signInAnonymously, db, doc, getDoc, setDoc, onSnapshot, appId } = window.FB;
                        if (!auth) throw new Error("No Auth");
                        await signInAnonymously(auth); 
                        if(db) {
                            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'content', 'main');
                            const snap = await getDoc(ref);
                            if (snap.exists || (typeof snap.exists === 'function' && snap.exists())) {
                                setContent(snap.data());
                            } else {
                                await setDoc(ref, { questions: DEFAULT_QUESTIONS, stories: ALUMNI_STORIES }, { merge: true });
                                setContent({ questions: DEFAULT_QUESTIONS, stories: ALUMNI_STORIES });
                            }

                            const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'content', 'admin_settings_v2');
                            const configSnap = await getDoc(configRef);
                            if (!configSnap.exists && !(typeof configSnap.exists === 'function' && configSnap.exists())) {
                                await setDoc(configRef, { passHash: '7077686f6d65636f6d696e67706f6c79755f32303236', startDate: getLocalYYYYMMDD(), locationOrder: LOCATIONS.map(l=>l.id) });
                            }
                            
                            onSnapshot(configRef, (docSnap) => {
                                if (docSnap.exists || (typeof docSnap.exists === 'function' && docSnap.exists())) {
                                    setAdminConfig(docSnap.data());
                                }
                            });
                        }
                    } catch (e) { console.error("Offline/Init", e); }
                    setInitializing(false);
                };
                init();
            }, []);

            useEffect(() => {
                if (user && user.uid !== 'offline-user' && user.role !== 'admin') {
                    const { db, doc, onSnapshot, appId } = window.FB;
                    const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'participants', user.uid);
                    const unsubscribe = onSnapshot(userRef, (docSnap) => {
                        if (docSnap.exists || (typeof docSnap.exists === 'function' && docSnap.exists())) {
                            const data = docSnap.data();
                            setCleared(data.clearedLocations || []);
                            setBonusLocs(data.bonusLocations || []);
                            setUser(prev => ({...prev, ...data}));
                        }
                    }, (error) => {
                        console.error("Snapshot error:", error);
                    });
                    return () => unsubscribe();
                }
            }, [user?.uid]);

            useEffect(() => {
                if (user?.role === 'admin') {
                    const { db, collection, onSnapshot, appId } = window.FB;
                    if (!db) return;

                    const q = collection(db, 'artifacts', appId, 'public', 'data', 'participants');
                    const unsubscribe = onSnapshot(q, (snapshot) => {
                        const users = [];
                        const userAnswers = {};
                        let totalPointsAll = 0;
                        
                        snapshot.forEach(doc => {
                            const u = doc.data();
                            users.push(u);
                            const pts = (u.clearedLocations?.length || 0) + (u.bonusLocations?.length || 0);
                            userAnswers[u.email] = pts;
                            totalPointsAll += pts;
                        });
                        setAllUsers(users);
                        setStats({ userAnswers, totalPoints: totalPointsAll });
                    }, (error) => {
                        console.error("Admin snapshot error:", error);
                    });
                    return () => unsubscribe();
                }
            }, [user?.role]);
            
            useEffect(() => {
                const autoLogin = async () => {
                     let savedEmail = null;
                     try { savedEmail = localStorage.getItem('polyu_hunt_email'); } catch (e) {}
                     if (savedEmail && !user && !initializing) {
                         await handleCheckUser({ email: savedEmail, name: '', version: 'local' }, true);
                     }
                };
                if (!initializing) autoLogin();
            }, [initializing]);

            useEffect(() => {
                if (user && !initializing) {
                    const params = new URLSearchParams(window.location.search);
                    const scanId = params.get('scan');
                    if (scanId) {
                        const loc = LOCATIONS.find(l => l.qrId === scanId || l.id === scanId);
                        if (loc) {
                            const isDayUnlocked = unlockedLocationIds.includes(loc.id);
                            if (!isDayUnlocked) {
                                showNotify(t.lockedTitle, t.lockedMsg, 'error', 'fa-lock');
                            } else {
                                const isCleared = cleared.includes(loc.id);
                                if (!isCleared) {
                                    // If scanning from URL, automatically set global activation to true
                                    setGlobalUnlocked(true);
                                    try { localStorage.setItem('polyu_hunt_global_unlocked', 'true'); } catch(e){}
                                    setActiveMission(loc);
                                } else {
                                    showNotify(t.alreadyClearedTitle, t.alreadyClearedMsg, 'info', loc.icon);
                                }
                            }
                        }
                        window.history.replaceState(null, '', window.location.pathname);
                    }
                }
            }, [user, initializing, cleared, t, unlockedLocationIds]); 

            const handleCheckUser = async (data, silent = false) => {
                const { db, collection, getDocs, auth, appId, setDoc, doc, deleteDoc, deleteField } = window.FB;
                if (!auth?.currentUser || !data.email) return false;

                try {
                    const normalizedEmail = data.email.toLowerCase().trim();
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'participants'));
                    
                    let foundAny = false;
                    let mergedLocations = [];
                    let mergedBonus = [];
                    let latestProfile = null;
                    const oldDocIds = [];
                    
                    snap.forEach(docSnap => {
                        const d = docSnap.data();
                        if (d.email && d.email.toLowerCase() === normalizedEmail) {
                            foundAny = true;
                            latestProfile = d; 
                            oldDocIds.push(docSnap.id);
                            
                            if (Array.isArray(d.clearedLocations)) {
                                d.clearedLocations.forEach(id => { if (!mergedLocations.includes(id)) mergedLocations.push(id); });
                            }
                            if (Array.isArray(d.bonusLocations)) {
                                d.bonusLocations.forEach(id => { if (!mergedBonus.includes(id)) mergedBonus.push(id); });
                            }
                        }
                    });
                    
                    if (foundAny && latestProfile) {
                        const currentUid = auth.currentUser.uid;
                        
                        let finalVersion = latestProfile.version || data.version || 'local';
                        if (data.version && latestProfile.version && data.version !== latestProfile.version) {
                            if (!silent) alert(`${t.modeMismatch} ${latestProfile.version === 'local' ? t.local : t.overseas}`);
                            finalVersion = latestProfile.version; 
                        }

                        const updatedName = (data.name && data.name.trim() !== '') ? data.name.trim() : latestProfile.name;
                        delete latestProfile.missions_completed;

                        const mergedData = { 
                            ...latestProfile, uid: currentUid, name: updatedName,
                            clearedLocations: mergedLocations, bonusLocations: mergedBonus,
                            lastLogin: new Date().toISOString(), version: finalVersion,
                            missions_completed: deleteField() 
                        };
                        
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', currentUid), mergedData, { merge: true });

                        for (const oldId of oldDocIds) {
                            if (oldId !== currentUid) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', oldId)).catch(e=>{});
                        }

                        setUser(mergedData);
                        setCleared(mergedLocations);
                        setBonusLocs(mergedBonus);
                        setView('map');
                        try { localStorage.setItem('polyu_hunt_email', normalizedEmail); } catch (e) {}
                        return true; 
                    }
                } catch (e) { 
                    console.error(e); 
                    if (!silent) alert("Error connecting to database.");
                }
                return false;
            };

            const handleRegister = async (data) => {
                const { db, doc, setDoc, auth, appId } = window.FB;
                const uid = auth?.currentUser?.uid || 'offline-user';
                const normalizedEmail = data.email.toLowerCase().trim();

                const newUser = { 
                    ...data, email: normalizedEmail, uid, 
                    clearedLocations: [], bonusLocations: [], 
                    joinedAt: new Date().toISOString(), giftClaimed: false 
                };

                if (auth && auth.currentUser && db) {
                    try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', uid), newUser); } catch (e) {}
                }
                
                setUser(newUser); setCleared([]); setBonusLocs([]); setView('map');
                try { localStorage.setItem('polyu_hunt_email', normalizedEmail); } catch (e) {}
            };

            const handleMissionComplete = async (locId, earnedBonus) => {
                const { db, doc, updateDoc, arrayUnion, appId, auth } = window.FB;
                
                const newCleared = [...cleared, locId];
                setCleared(newCleared);
                if (earnedBonus) setBonusLocs([...bonusLocs, locId]);

                const completedTime = new Date().toISOString();

                let payloadToUpdate = { clearedLocations: arrayUnion(locId) };
                if (earnedBonus) payloadToUpdate.bonusLocations = arrayUnion(locId);
                if (newCleared.length === LOCATIONS.length) payloadToUpdate.completedAt = completedTime;

                if (auth && auth.currentUser && db) {
                    const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid);
                    await updateDoc(userRef, payloadToUpdate);
                }
                
                if (newCleared.length === LOCATIONS.length) {
                    if (window.confetti) window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, zIndex: 9999 });
                    const durationStr = formatDuration(user.joinedAt, completedTime);
                    if (user.version === 'overseas') {
                        setUser(prev => ({...prev, completedAt: completedTime}));
                        setGiftClaimOpen(true);
                    } else {
                        showNotify(t.grandSuccessTitle, `${t.grandSuccessMsg}\n\n${t.timeTaken}${durationStr}`, "success", "fa-crown");
                    }
                } else {
                    const earnedPoints = earnedBonus ? 2 : 1;
                    showNotify(t.stampCollectedTitle, `You earned ${earnedPoints} Point(s)!`, "success", "fa-star");
                }
                setActiveMission(null); setView('map');
            };

            const handleLogout = async () => {
                const { auth, signOut } = window.FB;
                if (auth) try { await signOut(auth); } catch (e) {}
                setUser(null); setView('register'); setCleared([]); setGlobalUnlocked(false);
                try { localStorage.removeItem('polyu_hunt_email'); localStorage.removeItem('polyu_hunt_global_unlocked'); } catch (e) {}
                window.location.reload();
            };

            const showNotify = (title, message, type = 'info', customIcon = null, customAction = null) => {
                setNotification({ title, message, type, customIcon, customAction });
            };

            if (initializing) return <div className="min-h-screen flex items-center justify-center bg-gray-100 text-[#A6192E] font-bold"><i className="fa fa-spinner fa-spin mr-2"></i> Loading Campus...</div>;

            if(!user) {
                return (
                    <div className={`text-gray-800 lang-${lang}`}>
                        {tcOpen && <TCModal onClose={() => setTcOpen(false)} lang={lang} />}
                        <Register onRegister={handleRegister} onCheckUser={handleCheckUser} onAdminLogin={async () => {
                            const { db, doc, setDoc, auth, appId } = window.FB;
                            if (auth.currentUser) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid), { name: 'Administrator', email: 'admin@system', role: 'admin', clearedLocations: [] });
                            setUser({ name: 'Administrator', email: 'admin@system', role: 'admin', clearedLocations: [] });
                            setView('map');
                        }} lang={lang} setLang={setLang} onOpenTC={() => setTcOpen(true)} adminConfig={adminConfig} />
                    </div>
                );
            }

            const currentTotalPoints = cleared.length + bonusLocs.length;

            return (
                <div className={`text-gray-800 lang-${lang}`}>
                    {tcOpen && <TCModal onClose={() => setTcOpen(false)} lang={lang} />}
                    {notification && <NotificationModal {...notification} onClose={()=>setNotification(null)} lang={lang} />}
                    {stampBookOpen && <StampBook locations={orderedLocations} clearedLocations={cleared} onClose={()=>setStampBookOpen(false)} lang={lang} />}
                    {giftClaimOpen && <GiftClaimModal user={user} onClose={()=>setGiftClaimOpen(false)} onSubmit={async (data) => {
                        const { db, doc, updateDoc, appId, auth } = window.FB;
                        if (auth && auth.currentUser && db) {
                            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid), { giftRequest: data, giftClaimed: true });
                            setUser(prev => ({ ...prev, giftClaimed: true }));
                        }
                    }} lang={lang} />}
                    {profileOpen && <ProfileModal user={user} onClose={()=>setProfileOpen(false)} onUpdate={async (updates) => {
                        const { db, doc, updateDoc, appId, auth } = window.FB;
                        setUser({ ...user, ...updates });
                        if (auth && auth.currentUser && db) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'participants', auth.currentUser.uid), updates);
                        showNotify("Profile Updated", "Your information has been updated successfully.", "success", "fa-user-check");
                    }} lang={lang} onOpenTC={() => setTcOpen(true)} />}

                    {view === 'map' && (
                        <div className="flex flex-col h-screen bg-gray-50/50 backdrop-blur-sm">
                            <header className="bg-white shadow-sm px-4 py-2 z-10 grid grid-cols-[1fr_auto] gap-4 items-stretch relative">
                                <div className="flex flex-col gap-2 justify-center">
                                    <div className="flex items-center gap-3">
                                        <button onClick={()=>setProfileOpen(true)} className="w-10 h-10 bg-[#A6192E] rounded-full flex items-center justify-center text-white font-bold text-lg flex-shrink-0 hover:opacity-90 shadow-sm" title={t.myProfile}>
                                            <i className="fa fa-user"></i>
                                        </button>
                                        <div>
                                            <h1 className="font-bold text-gray-800 leading-none mb-1 text-lg">{user.name}</h1>
                                            <span className={`text-[10px] px-2 py-0.5 rounded font-bold whitespace-nowrap ${user.version==='overseas'?'bg-blue-100 text-blue-700':'bg-red-100 text-red-700'}`}>{user.role==='admin'?t.adminMode:t[user.version]}</span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <LanguageSwitcher lang={lang} setLang={setLang} />
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={()=>setStampBookOpen(true)} className="bg-yellow-100 text-yellow-800 px-4 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-1 border border-yellow-200 shadow-sm h-full w-24">
                                        <i className="fa fa-star text-2xl"></i> 
                                        <span>{currentTotalPoints} {t.points}</span>
                                    </button>
                                    <button onClick={handleLogout} className="w-12 h-full rounded-xl bg-gray-100 text-gray-500 flex flex-col items-center justify-center gap-1 border border-gray-200 shadow-sm hover:bg-gray-200">
                                        <i className="fa fa-sign-out-alt text-xl"></i>
                                    </button>
                                </div>
                            </header>
                            <main className="flex-grow relative overflow-hidden w-full pt-0 pb-4 flex flex-col items-center justify-start">
                                <div className="map-container shadow-inner border-b border-x border-gray-300 rounded-t-none md:rounded-t-xl md:border-t md:mt-2">
                                    <img src="./image/CampusMap.png" alt="Campus Map" className="map-image" draggable="false" onError={(e) => { e.target.onerror = null; e.target.src = './image/CampusMap.png'; }} />
                                    <div className="map-overlay">
                                        {orderedLocations.map(loc => {
                                            const isCleared = cleared.includes(loc.id);
                                            const isDayUnlocked = unlockedLocationIds.includes(loc.id);
                                            
                                            let lockReason = false;
                                            if (!isDayUnlocked) lockReason = 'date';
                                            const isLocked = !!lockReason;

                                            return (
                                                <div key={loc.id} className={`absolute flex flex-col items-center group map-pin ${isCleared?'opacity-75':'cursor-pointer'} ${isLocked?'locked grayscale':''}`} style={{left: `${loc.mapX}%`, top: `${loc.mapY}%`}} onClick={() => {
                                                    if (isCleared) { showNotify(t.alreadyClearedTitle, t.alreadyClearedMsg, 'info', loc.icon); return; }
                                                    if (isLocked) { showNotify(t.lockedTitle, t.lockedMsg, 'error', 'fa-clock'); return; }
                                                    setActiveMission(loc);
                                                }}>
                                                    <div className={`pin-icon-wrapper ${isCleared?'bg-green-500 text-white':(isLocked?'bg-gray-400 text-white':'bg-[#A6192E] text-white')}`}>
                                                        <i className={`fa ${isCleared?'fa-check':(isLocked?'fa-lock':loc.icon)}`}></i>
                                                    </div>
                                                    <div className="pin-label">{loc.name[lang]}</div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </main>
                            {user.role === 'admin' && <div className="bg-white border-t p-4"><button onClick={()=>setView('admin')} className="w-full bg-blue-800 text-white py-3 rounded-lg font-bold shadow"><i className="fa fa-chart-bar mr-2"></i> {t.adminPortal}</button></div>}
                        </div>
                    )}
                    
                    {activeMission && (
                        <MissionOrchestrator 
                            location={activeMission} 
                            globalUnlocked={globalUnlocked} 
                            onActivate={() => { setGlobalUnlocked(true); try { localStorage.setItem('polyu_hunt_global_unlocked', 'true'); } catch(e){} }} 
                            onComplete={handleMissionComplete} 
                            onCancel={() => setActiveMission(null)} 
                            content={content} 
                            lang={lang} 
                        />
                    )}

                    {view === 'admin' && (
                        <div className="fixed inset-0 z-50 bg-gray-100 h-screen overflow-y-auto">
                            <div className="bg-white p-4 shadow flex justify-between sticky top-0 z-10">
                                <div className="flex items-center gap-2"><button onClick={()=>setView('map')}><i className="fa fa-arrow-left"></i></button><h2 className="font-bold">{t.adminPortal}</h2></div>
                                <div className="flex bg-gray-100 rounded p-1 gap-1 text-[10px]">{['users','stats','qr','editor','settings'].map(x => <button key={x} onClick={e=>e.target.parentElement.nextElementSibling.setAttribute('data-tab', x)} className="px-2 py-1 rounded font-bold text-gray-500">{x.toUpperCase()}</button>)}</div>
                            </div>
                            <div className="p-4 max-w-5xl mx-auto space-y-4">
                                <div className="space-y-6 fade-in">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-white p-4 rounded-xl shadow-sm">
                                            <p className="text-xs text-gray-500 uppercase">{t.totalUsers}</p>
                                            <p className="text-2xl font-bold text-[#A6192E]">{allUsers.length}</p>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl shadow-sm">
                                            <p className="text-xs text-gray-500 uppercase">TOTAL POINTS EARNED</p>
                                            <p className="text-2xl font-bold text-[#A6192E]">{stats.totalPoints || 0}</p>
                                        </div>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm overflow-hidden mt-6">
                                        <div className="p-4 border-b bg-gray-50 font-bold text-gray-700">All Registered Users ({allUsers.length})</div>
                                        <div className="overflow-x-auto max-h-96">
                                            <table className="w-full text-sm text-left whitespace-nowrap">
                                                <thead className="text-xs text-gray-500 uppercase bg-gray-50 border-b sticky top-0 z-10">
                                                    <tr>
                                                        <th className="px-6 py-3 select-none">{t.fullName}</th>
                                                        <th className="px-6 py-3 select-none">{t.email}</th>
                                                        <th className="px-6 py-3 select-none">Points</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {allUsers.map((u, i) => (
                                                        <tr key={i} className="bg-white border-b transition-colors group">
                                                            <td className="px-6 py-3 font-medium text-gray-900">{u.name}</td>
                                                            <td className="px-6 py-3 text-gray-600">{u.email}</td>
                                                            <td className="px-6 py-3 font-bold text-[#A6192E]">{stats.userAnswers[u.email] || 0}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
