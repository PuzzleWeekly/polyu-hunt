                if (!videoRef.current || !canvasRef.current) return;
                setIsCapturing(true);
                const v = videoRef.current; 
                const c = canvasRef.current; 
                const ctx = c.getContext('2d');
                
                // Strict vertical aspect ratio (1080x1920)
                const targetWidth = 1080;
                const targetHeight = 1920;
                c.width = targetWidth;
                c.height = targetHeight;
                
                const vRatio = v.videoWidth / v.videoHeight;
                const targetRatio = targetWidth / targetHeight;
                let sWidth = v.videoWidth;
                let sHeight = v.videoHeight;
                let sx = 0, sy = 0;

                if (vRatio > targetRatio) {
                    sWidth = sHeight * targetRatio;
                    sx = (v.videoWidth - sWidth) / 2;
                } else {
                    sHeight = sWidth / targetRatio;
                    sy = (v.videoHeight - sHeight) / 2;
                }

                if (facingMode === 'user') { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
                ctx.drawImage(v, sx, sy, sWidth, sHeight, 0, 0, targetWidth, targetHeight);
                if (facingMode === 'user') ctx.setTransform(1, 0, 0, 1, 0, 0);
                
                const frame = new Image();
                frame.crossOrigin = "anonymous";
                frame.src = `image/frame_${locationId}.png`;
                frame.onload = () => {
                    ctx.drawImage(frame, 0, 0, targetWidth, targetHeight);
                    setPhotoData(c.toDataURL('image/png'));

                                    {!isOverseas && (
                                        <button onClick={() => setView('qr')} disabled={hasQrPt} className={`w-full flex items-center gap-4 p-5 rounded-2xl border-2 transition text-left
                                            ${hasQrPt ? 'border-green-500 bg-green-50' : 'border-gray-200 bg-white hover:border-yellow-400 hover:shadow-md'}`}>
                                            <div className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl shrink-0
                                                ${hasQrPt ? 'bg-green-500 text-white' : 'bg-yellow-100 text-yellow-600'}`}>
                                                <i className={`fa ${hasQrPt ? 'fa-check' : 'fa-qrcode'}`}></i>
                                            </div>
                                            <div className="flex-grow">
                                                <h3 className={`font-bold text-lg ${hasQrPt ? 'text-green-700' : 'text-gray-800'}`}>{t.scanQr}</h3>
                                            </div>
                                        </button>
                                    )}

                                    <button onClick={() => setView('quiz')} disabled={hasQuizPt || !isQuizUnlocked} className={`w-full flex items-center gap-4 p-5 rounded-2xl border-2 transition text-left relative overflow-hidden
                                        ${hasQuizPt ? 'border-green-500 bg-green-50' : (!isQuizUnlocked ? 'border-gray-100 bg-gray-50 opacity-80' : 'border-gray-200 bg-white hover:border-blue-400 hover:shadow-md')}`}>
                                        <div className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl shrink-0 z-10
                                            ${hasQuizPt ? 'bg-green-500 text-white' : (!isQuizUnlocked ? 'bg-gray-200 text-gray-400' : 'bg-blue-100 text-blue-600')}`}>
                                            <i className={`fa ${hasQuizPt ? 'fa-check' : (!isQuizUnlocked ? 'fa-lock' : 'fa-question')}`}></i>
                                        </div>
                                        <div className="flex-grow z-10">
                                            <h3 className={`font-bold text-lg ${hasQuizPt ? 'text-green-700' : (!isQuizUnlocked ? 'text-gray-400' : 'text-gray-800')}`}>{t.answerQ}</h3>
                                            {!hasQuizPt && !isQuizUnlocked && <p className="text-sm font-bold mt-1 text-red-500">{t.unlocksOn} {unlockStr}</p>}
                                        </div>
                                        {!isQuizUnlocked && !hasQuizPt && <div className="absolute inset-0 opacity-10" style={{ backgroundImage: 'repeating-linear-gradient(45deg, transparent, transparent 10px, #000 10px, #000 20px)' }}></div>}
                                    </button>

                                    <div className="pt-4 border-t border-gray-100 mt-2">
                                        <button onClick={() => setView('photo')} disabled={totalPts === 0} className={`w-full flex flex-col items-center justify-center p-6 rounded-2xl border-2 transition
                                            ${totalPts > 0 ? 'border-purple-200 bg-gradient-to-br from-purple-50 to-pink-50 hover:shadow-lg' : 'border-gray-100 bg-gray-50 opacity-60'}`}>
                                            <i className={`fa fa-camera text-4xl mb-3 ${totalPts > 0 ? 'text-purple-500' : 'text-gray-300'}`}></i>
                                            <span className={`font-black text-lg ${totalPts > 0 ? 'text-purple-800' : 'text-gray-400'}`}>{t.takePhoto}</span>
                                            {totalPts === 0 && <span className="text-xs font-bold text-gray-400 mt-2 text-center max-w-[200px]">{isOverseas ? t.lockedPhotoOverseas : t.lockedPhoto}</span>}
                                        </button>
                                    </div>
                                </div>
                            ) : view === 'qr' ? (
                                <Scanner lang={lang} onScanSuccess={handleScanSuccess} />
                            ) : view === 'quiz' ? (
                                <QuizModule locationId={location.id} content={content} lang={lang} onClear={()=>handlePointGained('quiz')} onFail={()=>setView(null)} />
                            ) : (
                                <PhotoBooth locationId={location.id} lang={lang} onBack={()=>setView(null)} />
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ActivationModal = ({ onActivate, lang, userVersion }) => {
            const t = TRANSLATIONS[lang];
            const handleScanSuccess = (code) => {
                const expectedMaster = userVersion === 'overseas' ? MASTER_KEY_OVERSEAS : MASTER_KEY_LOCAL;
                const wrongMaster = userVersion === 'overseas' ? MASTER_KEY_LOCAL : MASTER_KEY_OVERSEAS;

                if (code === expectedMaster) {
                    onActivate({ type: 'master' });
                } else if (code === wrongMaster) {
                    alert(t.wrongModeCode);
                } else {
                    if (userVersion === 'overseas') {
                        alert(t.invalidPin);
                    } else {
                        const loc = LOCATIONS.find(l => l.code === code);
                        if (loc) onActivate({ type: 'location', locationId: loc.id });
                        else alert(t.invalidPin);
                    }
                }
            };
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-gray-900 text-white">
                    <div className="w-full h-full max-w-md mx-auto relative flex flex-col">
                        <div className="p-6 text-center shrink-0 z-20">
                            <h2 className="text-2xl font-black text-[#A6192E] mb-2">{t.activateTitle}</h2>
                            <p className="text-gray-400 text-sm font-medium">{userVersion === 'overseas' ? t.activateMsgOverseas : t.activateMsgLocal}</p>
                        </div>
                        <div className="flex-grow relative">
                            <Scanner lang={lang} onScanSuccess={handleScanSuccess} />
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [lang, setLang] = useState('en'); 
            const [activeLoc, setActiveLoc] = useState(null);
            const [notification, setNotification] = useState(null); 
            const [stampBookOpen, setStampBookOpen] = useState(false);
            const [giftOpen, setGiftOpen] = useState(false);
            const [rulesOpen, setRulesOpen] = useState(false);
            
            const [cleared, setCleared] = useState([]); 
            const [bonusLocs, setBonusLocs] = useState([]); 
            const [content, setContent] = useState({});
            const [adminConfig, setAdminConfig] = useState({});
            const [initialized, setInitialized] = useState(false);

            const [loginStep, setLoginStep] = useState(1);
            const [loginEmail, setLoginEmail] = useState('');

            useEffect(() => {
                const initApp = async () => {
                    const savedEmail = localStorage.getItem('polyu_hunt_email');
                    const { db, auth, appId } = window.FB;
                    
                    try {
                        await auth.signInAnonymously();
                        
                        db.collection('artifacts').doc(appId).collection('public').doc('data').collection('content').doc('main').onSnapshot(snap => setContent(snap.data() || {}));
                        db.collection('artifacts').doc(appId).collection('public').doc('data').collection('content').doc('admin_settings_v2').onSnapshot(snap => setAdminConfig(snap.data() || {}));

                        if (savedEmail) {
                            const snapshot = await db.collection(`artifacts/${appId}/public/data/participants`).where('email', '==', savedEmail).get();
                            if (!snapshot.empty) {
                                const data = snapshot.docs[0].data();
                                setUser({ ...data, uid: snapshot.docs[0].id });
                                setCleared(data.clearedLocations || []);
                                setBonusLocs(data.bonusLocations || []);
                            }
                        }
                    } catch (e) {
                        console.error("Auth/DB failed on init:", e);
                    }
                    setInitialized(true);
                };
                initApp();
            }, []);

            useEffect(() => {
                if (user?.uid) {
                    const { db, appId } = window.FB;
                    const unsub = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('participants').doc(user.uid).onSnapshot(snap => {
                        if (snap.exists) {
                            const data = snap.data();
                            setUser(prev => ({ ...prev, ...data }));
                            setCleared(data.clearedLocations || []);
                            setBonusLocs(data.bonusLocations || []);
                        }
                    });
                    return () => unsub();
                }
            }, [user?.uid]);

            // Helper to ensure auth is complete before checking email
            const ensureAuth = async () => {
                const { auth } = window.FB;
                if (!auth.currentUser) {
                    await auth.signInAnonymously();
                }
            };

            const handleCheckEmail = async (e) => {
                e.preventDefault();
                const email = e.target.email.value.trim().toLowerCase();
                setLoginEmail(email);
                const { db, appId } = window.FB;
                
                try {
                    await ensureAuth(); // Prevent Firebase connection race conditions
                    const snapshot = await db.collection(`artifacts/${appId}/public/data/participants`).where('email', '==', email).get();
                    if (!snapshot.empty) {
                        const existingDoc = snapshot.docs[0];
                        const fullData = { ...existingDoc.data(), uid: existingDoc.id };
                        localStorage.setItem('polyu_hunt_email', fullData.email);
                        setUser(fullData);
                        setCleared(fullData.clearedLocations || []);
                        setBonusLocs(fullData.bonusLocations || []);
                    } else {
                        setLoginStep(2); 
                    }
                } catch(err) { 
                    console.error("Login error: ", err);
                    alert("Network error checking email. Please check your connection and try again."); 
                }
            };

            const handleRegisterDetails = async (e) => {
                e.preventDefault();
                const form = { 
                    name: e.target.name.value.trim(), 
                    email: loginEmail, 
                    version: e.target.version.value 
                };
                const { auth, db, appId } = window.FB;
                try {
                    await ensureAuth();
                    const fullData = { ...form, uid: auth.currentUser.uid, joinedAt: new Date().toISOString(), clearedLocations: [], bonusLocations: [], hasActivated: false };
                    await db.collection(`artifacts/${appId}/public/data/participants`).doc(auth.currentUser.uid).set(fullData);
                    localStorage.setItem('polyu_hunt_email', form.email);
                    setUser(fullData);
                } catch(err) { alert("Registration failed. Network error."); }
            };

            const handleActivate = async (result) => {
                const { db, appId } = window.FB;
                if (!user) return;
                
                let newBonus = [...bonusLocs];
                if (result.type === 'location' && user.version === 'local' && !bonusLocs.includes(result.locationId)) {
                    newBonus.push(result.locationId);
                    setBonusLocs(newBonus);
                }
                
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('participants').doc(user.uid).update({
                        hasActivated: true, bonusLocations: newBonus
                    });
                    setUser(prev => ({ ...prev, hasActivated: true }));
                    
                    if (result.type === 'location') {
                        if(user.version === 'local') showNotify(TRANSLATIONS[lang].stampCollectedTitle, "Game Activated! 1 Point Earned.", "success", "fa-star");
                        const loc = LOCATIONS.find(l => l.id === result.locationId);
                        if (loc) setActiveLoc(loc);
                    } else {
                        showNotify("Map Unlocked!", "Master key used. Game is active.", "success", "fa-unlock");
                    }
                } catch(e) { console.error(e); }
            };

            const handleLogout = async () => {
                setUser(null); setCleared([]); setBonusLocs([]); setLoginStep(1); setLoginEmail('');
                try { localStorage.removeItem('polyu_hunt_email'); } catch (e) {}
            };

            const handleSavePoints = async (locId, type) => {
                const { db, appId } = window.FB;
                if (!user) return;
                let newCleared = [...cleared];
                let newBonus = [...bonusLocs];
                if (type === 'quiz' && !cleared.includes(locId)) newCleared.push(locId);
                if (type === 'qr' && !bonusLocs.includes(locId)) newBonus.push(locId);
                
                setCleared(newCleared); setBonusLocs(newBonus);
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('participants').doc(user.uid).update({
                        clearedLocations: newCleared, bonusLocations: newBonus
                    });
                } catch(e) {}
            };

            const showNotify = (title, message, type = 'info', customIcon = null) => setNotification({ title, message, type, customIcon });

            const fontClass = lang === 'sc' ? 'lang-sc' : (lang === 'tc' ? 'lang-tc' : 'lang-en');
            const t = TRANSLATIONS[lang];
            const isOverseas = user?.version === 'overseas';
            const totalPts = isOverseas ? cleared.length : cleared.length + bonusLocs.length; 

            if (!initialized) return <div className="min-h-screen flex items-center justify-center bg-gray-50"><i className="fa fa-spinner fa-spin text-4xl text-[#A6192E]"></i></div>;
            
            if (!user) return (
                <div className={`min-h-screen flex items-center justify-center p-4 bg-gray-50 relative overflow-hidden ${fontClass}`}>
                    {rulesOpen && <RulesModal onClose={() => setRulesOpen(false)} lang={lang} />}
                    <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm relative z-10 border border-gray-100 slide-up">
                        <div className="flex justify-end mb-4"><LanguageSwitcher lang={lang} setLang={setLang} /></div>
                        <div className="text-center mb-8">
                            <div className="w-20 h-20 mx-auto bg-[#A6192E] rounded-2xl flex items-center justify-center shadow-lg transform rotate-3 mb-4"><i className="fa fa-university text-4xl text-white transform -rotate-3"></i></div>
                            <h1 className="text-3xl font-black text-gray-800 leading-tight">{t.appTitle}</h1>
                            <p className="text-[#A6192E] font-bold text-sm tracking-widest uppercase mt-1">{t.subtitle}</p>
                        </div>
                        
                        {loginStep === 1 ? (
                            <form onSubmit={handleCheckEmail} className="space-y-4 fade-in">
                                <div><label className="text-xs font-bold text-gray-500 ml-1">{t.emailPrompt}</label><input type="email" name="email" required className="w-full p-4 mt-1 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-[#A6192E] outline-none transition font-medium" /></div>
                                <button type="submit" className="w-full bg-[#A6192E] text-white py-4 rounded-xl font-bold shadow-lg hover:bg-red-800 transition mt-6 text-lg">{t.nextBtn}</button>
                            </form>
                        ) : (
                            <form onSubmit={handleRegisterDetails} className="space-y-4 fade-in">
                                <div className="bg-green-50 text-green-700 p-3 rounded-lg text-sm font-bold border border-green-200 mb-2">{t.newAccountPrompt}</div>
                                <div><label className="text-xs font-bold text-gray-500 ml-1">{t.fullName}</label><input name="name" required className="w-full p-4 mt-1 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-[#A6192E] outline-none transition font-medium" /></div>
                                
                                <div className="grid grid-cols-2 gap-3 mt-4">
                                    <label className="flex items-center gap-2 p-3 border rounded-xl font-bold text-sm cursor-pointer hover:bg-gray-50"><input type="radio" name="version" value="local" defaultChecked className="accent-[#A6192E] w-4 h-4" /> {t.local}</label>
                                    <label className="flex items-center gap-2 p-3 border rounded-xl font-bold text-sm cursor-pointer hover:bg-gray-50"><input type="radio" name="version" value="overseas" className="accent-[#A6192E] w-4 h-4" /> {t.overseas}</label>
                                </div>
                                <button type="submit" className="w-full bg-[#A6192E] text-white py-4 rounded-xl font-bold shadow-lg hover:bg-red-800 transition mt-6 text-lg">{t.registerBtn}</button>
                                <button type="button" onClick={()=>setLoginStep(1)} className="w-full text-sm font-bold text-gray-500 mt-2 hover:text-gray-800">Back</button>
                            </form>
                        )}
                        <div className="mt-8 text-center border-t pt-4">
                            <button onClick={() => setRulesOpen(true)} className="text-xs font-bold text-gray-400 hover:text-[#A6192E] underline">{t.rulesBtn}</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className={`text-gray-800 ${fontClass} h-screen w-full overflow-hidden flex flex-col relative`}>
                    {notification && <NotificationModal {...notification} onClose={()=>setNotification(null)} lang={lang} />}
                    {user && !user.hasActivated && <ActivationModal onActivate={handleActivate} lang={lang} userVersion={user.version} />}

                    {activeLoc && (
                        <MissionOrchestrator 
                            location={activeLoc} user={{...user, clearedLocations: cleared, bonusLocations: bonusLocs}} 
                            content={content} adminConfig={adminConfig} lang={lang} 
                            onSavePoints={handleSavePoints} onClose={()=>setActiveLoc(null)} showNotify={showNotify}
                        />
                    )}
                    
                    {giftOpen && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/80 p-4 fade-in backdrop-blur-sm">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md relative overflow-hidden">
                                <div className="p-6 bg-gradient-to-br from-purple-600 to-indigo-700 text-white text-center relative">
                                    <button onClick={()=>setGiftOpen(false)} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/40"><i className="fa fa-times"></i></button>
                                    <i className="fa fa-gift text-5xl mb-2 drop-shadow-md"></i>
                                    <h2 className="text-2xl font-bold">{t.giftTitle}</h2>
                                </div>
                                
                                {totalPts >= 10 ? (
                                    <form onSubmit={async (e)=>{
                                        e.preventDefault(); 
                                        const addressInput = e.target.address.value.trim();
                                        try {
                                            const { db, appId } = window.FB;
                                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('participants').doc(user.uid).update({ address: addressInput });
                                            setGiftOpen(false);
                                            showNotify(t.giftSuccessTitle, t.giftSuccessMsg, "success", "fa-check-circle");
                                        } catch(error) {
                                            console.error("Error saving address", error);
                                            alert("Network error saving address. Please try again.");
                                        }
                                    }} className="p-6 space-y-4 bg-gray-50">
                                        <div className="bg-yellow-50 border-l-4 border-yellow-400 p-3 rounded text-sm text-yellow-800 font-bold">
                                            {user.version === 'overseas' ? t.overseasOnly : t.localOnly}
                                        </div>
                                        <textarea name="address" className="w-full p-4 mt-1 border-2 border-gray-200 rounded-xl bg-white focus:border-purple-500 outline-none transition resize-none h-28" required placeholder={t.addressLabel}></textarea>
                                        <button type="submit" className="w-full bg-purple-600 text-white py-4 rounded-xl font-bold shadow-lg">{t.submitBtn}</button>
                                    </form>
                                ) : (
                                    <div className="p-8 text-center bg-gray-50">
                                        <div className="w-16 h-16 bg-gray-200 text-gray-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4"><i className="fa fa-lock"></i></div>
                                        <h3 className="font-black text-gray-800 text-xl mb-2">{t.giftPointsShort}</h3>
                                        <p className="text-gray-500 font-medium mb-6">{t.giftPointsDesc.replace('{pts}', totalPts)}</p>
                                        <button onClick={()=>setGiftOpen(false)} className="w-full bg-gray-800 text-white py-3 rounded-xl font-bold">Close</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {stampBookOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 fade-in backdrop-blur-sm" onClick={()=>setStampBookOpen(false)}>
                            <div className="bg-white rounded-3xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden shadow-2xl relative slide-up" onClick={e=>e.stopPropagation()}>
                                <div className="p-6 bg-gradient-to-br from-gray-800 to-gray-900 text-white flex justify-between items-center shrink-0">
                                    <div><h2 className="text-2xl font-black">{t.stamps}</h2><p className="text-gray-300 font-bold text-sm mt-1">{totalPts} Earned</p></div>
                                    <button onClick={()=>setStampBookOpen(false)} className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"><i className="fa fa-times"></i></button>
                                </div>
                                <div className="flex-grow overflow-y-auto p-4 bg-gray-50 grid grid-cols-2 gap-3">
                                    {LOCATIONS.map(loc => {
                                        const baseDone = cleared.includes(loc.id);
                                        const bonusDone = isOverseas ? false : bonusLocs.includes(loc.id);
                                        const locPts = (baseDone?1:0) + (bonusDone?1:0);
                                        const isCompleted = isOverseas ? baseDone : locPts === 2;
                                        
                                        return (
                                            <div key={loc.id} className={`flex flex-col items-center p-4 rounded-2xl border-2 transition-colors ${isCompleted?'border-green-500 bg-green-50':(!isOverseas && locPts===1?'border-yellow-400 bg-yellow-50':'border-gray-200 bg-white')}`}>
                                                <div className={`stamp-circle mb-3 ${isCompleted?'stamp-earned-2':(!isOverseas && locPts===1?'stamp-earned-1':'stamp-earned-0')}`}><i className={`fa ${loc.icon}`}></i></div>
                                                <span className="text-[11px] font-bold text-center leading-tight h-8 flex items-center text-gray-700">{loc.name[lang]}</span>
                                                <div className="mt-2 flex gap-1 justify-center w-full">
                                                    {!isOverseas && <div className={`w-3 h-3 rounded-full ${bonusDone?'bg-green-500':'bg-gray-200'}`}></div>}
                                                    <div className={`w-3 h-3 rounded-full ${baseDone?'bg-green-500':'bg-gray-200'}`}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-white/90 backdrop-blur shadow-sm px-4 py-3 z-10 grid grid-cols-[1fr_auto] gap-4 items-stretch absolute top-0 w-full rounded-b-3xl border-b border-gray-100">
                        <div className="flex flex-col gap-2 justify-center">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 bg-[#A6192E] rounded-full flex items-center justify-center text-white font-black text-xl shadow flex-shrink-0">{user.name.charAt(0).toUpperCase()}</div>
                                <div className="overflow-hidden">
                                    <h1 className="font-bold text-gray-800 truncate leading-none mb-1.5 text-lg">{user.name}</h1>
                                    <span className="text-[10px] px-2 py-0.5 rounded font-bold bg-red-100 text-red-700 uppercase tracking-wider">{t[user.version]}</span>
                                </div>
                            </div>
                            <LanguageSwitcher lang={lang} setLang={setLang} />
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={()=>setGiftOpen(true)} className="bg-purple-100 text-purple-800 px-3 py-1 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 shadow-sm h-full w-16 hover:bg-purple-200 transition">
                                <i className="fa fa-gift text-xl"></i><span>{t.giftBtn}</span>
                            </button>
                            <button onClick={()=>setStampBookOpen(true)} className="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 border border-yellow-200 shadow-sm h-full w-20 hover:bg-yellow-200 transition">
                                <i className="fa fa-book-open text-xl text-yellow-600"></i><span>{totalPts} {t.stamps}</span>
                            </button>
                            <button onClick={handleLogout} className="w-12 h-full rounded-xl bg-gray-100 text-gray-500 flex items-center justify-center shadow-sm hover:bg-gray-200 transition"><i className="fa fa-sign-out-alt text-lg"></i></button>
                        </div>
                    </header>

                    {/* Vertical Scrolling allows large maps to be viewed entirely on small devices */}
                    <main className="flex-grow relative w-full h-full pt-[127px] pb-4 px-2 bg-gray-50 overflow-y-auto">
                        <div className="map-container relative">
                            {LOCATIONS.map(loc => {
                                const baseDone = cleared.includes(loc.id);
                                const bonusDone = isOverseas ? false : bonusLocs.includes(loc.id);
                                const pts = (baseDone?1:0) + (bonusDone?1:0);
                                const pinStateClass = isOverseas ? (baseDone ? 'pin-2' : 'pin-0') : (pts===2?'pin-2':(pts===1?'pin-1':'pin-0'));
                                const iconClass = isOverseas ? (baseDone?'fa-check':'fa-map-marker-alt') : (pts===2?'fa-check-double':(pts===1?'fa-check':'fa-map-marker-alt'));

                                return (
                                    <div key={loc.id} className="loc-pin" style={loc.pos} onClick={() => setActiveLoc(loc)}>
                                        <div className={`pin-icon ${pinStateClass}`}><i className={`fa ${iconClass}`}></i></div>
                                        <div className="pin-label">{loc.name[lang]}</div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
